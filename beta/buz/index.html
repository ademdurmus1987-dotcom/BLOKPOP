<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7a4a22">
<title>Blokpop Buz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3c2412;font-family:var(--font);color:#1b1030;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;margin:0 auto;max-width:520px;padding:calc(var(--sat) + 6px) 8px 0;display:flex;align-items:center;gap:5px;pointer-events:none;z-index:5}
.ib{pointer-events:auto;flex:none;width:40px;height:40px;border-radius:12px;border:3px solid #3a2208;background:linear-gradient(180deg,#fffaf0,#efe2c8);color:#2b6fd6;font:700 19px/1 var(--font);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #3a2208;cursor:pointer;padding:0;transition:transform .07s,box-shadow .07s}
.ib.sm{width:30px;font-size:14px}
.ib.dn,.btn.dn{transform:translateY(3px) scale(.93);box-shadow:0 1px 0 #3a2208}
#sign{flex:1;min-width:0;height:42px;border-radius:10px;border:3px solid #3a2208;background:linear-gradient(180deg,#d99a5a,#a8642c);box-shadow:0 3px 0 #3a2208,inset 0 2px 0 rgba(255,235,200,.45);position:relative;display:flex;align-items:center;justify-content:center;font:700 19px/1 var(--font);color:#fff;text-shadow:0 2px 0 #4a2a0e,0 0 3px #4a2a0e;overflow:hidden}
#sign i{position:absolute;left:6px;right:6px;bottom:4px;height:4px;border-radius:3px;background:rgba(60,30,8,.45)}
#sign i b{display:block;height:100%;width:0;border-radius:3px;background:#9ff0ff;transition:width .25s}
#sign:before{content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:9px;background:radial-gradient(circle at 10% 100%,#fff 0 6px,transparent 7px),radial-gradient(circle at 35% 100%,#fff 0 5px,transparent 6px),radial-gradient(circle at 62% 100%,#fff 0 6px,transparent 7px),radial-gradient(circle at 88% 100%,#fff 0 5px,transparent 6px),linear-gradient(#fff,#fff) top/100% 4px no-repeat;opacity:.95}
#goal{flex:none;width:40px;height:40px;border-radius:11px;border:3px solid #3a2208;background:#cfe9ff;box-shadow:0 3px 0 #3a2208}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,4,.6);z-index:20;padding:20px}
.modal.on{display:flex}
.card{width:100%;max-width:360px;background:#fff6e4;border:4px solid #3a2208;border-radius:24px;box-shadow:0 6px 0 #3a2208,0 18px 30px rgba(0,0,0,.4);padding:18px 18px 16px;text-align:center;animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:2px 0 8px;font:700 25px/1.1 var(--font)}
.card p{margin:6px 0 12px;font:500 17px/1.35 var(--font)}
.card canvas{display:block;margin:4px auto 10px;border-radius:14px;border:3px solid #3a2208}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;margin-top:10px;border:3px solid #3a2208;border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--c,#3d9bff);color:#fff;font:700 21px/1 var(--font);text-shadow:0 2px 0 rgba(0,0,0,.28);box-shadow:0 5px 0 #3a2208;cursor:pointer;transition:transform .07s,box-shadow .07s}
.btn.g{--c:#43c94f}.btn.o{--c:#ff8c2e}.btn.w{--c:#fff;color:#2a1606;text-shadow:none;height:46px;font-size:18px}
.tag{display:inline-block;margin-bottom:6px;padding:3px 12px;border-radius:99px;border:2.5px solid #3a2208;background:#3d9bff;color:#fff;font:700 14px/1.2 var(--font);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.row{display:flex;gap:6px;margin:6px 0 4px}.row .btn{height:44px;font-size:16px;margin-top:0;--c:#fff;color:#2a1606;text-shadow:none}.row .btn.on{--c:#ffc93d}
.lbl{font:700 16px/1 var(--font);text-align:left;margin-top:12px}
.note{font:500 13px/1.3 var(--font);color:#7a5a3a;margin-top:6px}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);padding:8px 16px;border-radius:14px;border:3px solid #3a2208;background:#fff6e4;font:700 18px/1 var(--font);opacity:0;transition:opacity .2s;pointer-events:none;z-index:15}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <button class="ib" id="bHome" aria-label="Ana oyun">⌂</button>
  <button class="ib sm" id="bPrev" aria-label="Önceki seviye">◀</button>
  <div id="sign"><span id="signT">Buz 1</span><i><b id="signP"></b></i></div>
  <button class="ib sm" id="bNext" aria-label="Sonraki seviye">▶</button>
  <canvas id="goal" width="80" height="80" aria-label="Hedef resim"></canvas>
  <button class="ib" id="bRe" aria-label="Yeniden başla">↻</button>
  <button class="ib" id="bSet" aria-label="Ayarlar">⚙</button>
</div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>
<script src="izgara.js"></script>
<script src="motor.js"></script>
<script>
(function(){
'use strict';
BZM.setLib(BZ_IZGARA);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=(id)=>document.getElementById(id);
const FONT='Fredoka,system-ui,sans-serif';
const KEYC=['#ffc83d','#d6dde8','#ff7fb5'];
const TIPS={
  intro:{t:'Nasıl oynanır?',p:'Filler bantta <b>soldan sağa</b> gider. Her sütunda <b>en alttaki buz</b> filin rengindeyse kırılır, arkasındaki resim açılır. Aynı renk buzlar üst üste duruyorsa atış <b>delip geçer</b>.<br>Filin sırtındaki sayı <b>atış hakkıdır</b>. Hakkı artan fil <b>bekleme yerine</b> döner; yer kalmazsa kaybedersin.'},
  thick:{t:'Yeni: Kalın buz',p:'Kalın buz <b>2 atışta</b> kırılır. İlk atışta çatlar, ikinci atışta resim açılır.'},
  wood:{t:'Yeni: Tahta',p:'Çivili tahtayı <b>her renk fil</b> kırabilir. Üstündeki sayı kaç atış daha gerektiğini gösterir. Altındaki buzlar sonra kendi rengini ister.'},
  chain:{t:'Yeni: Zincir',p:'Zinciri sadece <b>zincirin rengindeki</b> fil kırabilir. Sonra altındaki buzlar kendi rengiyle kırılır.'},
  lock:{t:'Yeni: Kilit',p:'Kilitli buz <b>vurulamaz</b>. Anahtarı başka bir buz bloğunun içinde. O bloğu tamamen kırınca anahtar uçar ve kilidi açar.'}
};
const COMBO_AT=[15,40,80,150],COMBO_W=['Harika!','Süper!','Muhteşem!','EFSANE!'],COMBO_COL=[['#fff38a','#ffb000'],['#b6fff0','#18c9a2'],['#ffd0f2','#ff3fa0'],['#ffffff','#ff6a00']];
// ---------- kayit (ana oyunun kaydina dokunmaz) ----------
const SKEY='blokpop_buz_v1';
let SV={L:1,max:1,tips:{},mute:false,vib:2,best:{}};
try{const d=JSON.parse(localStorage.getItem(SKEY)||'null');if(d&&typeof d==='object')SV=Object.assign(SV,d);}catch(e){}
if(SV.vib==null)SV.vib=2;
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SV));}catch(e){}}
const qL=/[?&]sv=(\d+)/.exec(location.search);
// ---------- ses (ana oyunun ses motoru) ----------
let AC=null,master=null,wet=null,noiseBuf=null,lastPop=0,lastShoot=0,lastVib=0,lastTap=0;
function ensureAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();
    master=AC.createGain();master.gain.value=0.7;const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.attack.value=0.003;comp.release.value=0.2;master.connect(comp);comp.connect(AC.destination);
    wet=AC.createGain();wet.gain.value=0.22;const dl=AC.createDelay(0.5);dl.delayTime.value=0.13;const fb=AC.createGain();fb.gain.value=0.3;wet.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(comp);
    const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,d,type,vol,delay,slide,send){if(!AC||SV.mute)return;try{const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(master);if(send&&wet)g.connect(wet);o.start(t0);o.stop(t0+d+0.03);}catch(e){}}
function noise(d,vol,delay,type,f0,f1,send){if(!AC||SV.mute||!noiseBuf)return;try{const t0=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type||'bandpass';f.frequency.setValueAtTime(f0||1000,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+d);f.Q.value=1.2;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.1,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);s.connect(f);f.connect(g);g.connect(master);if(send&&wet)g.connect(wet);s.start(t0);s.stop(t0+d+0.03);}catch(e){}}
const SFX={
  tap(){const n=Date.now();if(n-lastTap<45)return;lastTap=n;tone(780,0.075,'sine',0.1,0,520);tone(1250,0.05,'sine',0.035,0.012,950);},
  launch(){tone(380,0.09,'sine',0.3,0,760);tone(760,0.04,'sine',0.035,0,1200);noise(0.16,0.12,0,'bandpass',400,2200);tone(90,0.12,'sine',0.25,0,50);},
  shoot(){const n=Date.now();if(n-lastShoot<55)return;lastShoot=n;tone(520,0.05,'triangle',0.09,0,240);noise(0.035,0.06,0,'highpass',2500,5000);},
  pop(c){const n=Date.now();if(n-lastPop<40)return;lastPop=n;tone(150,0.045,'sine',0.3,0,105);tone(420+(c%5)*40,0.03,'triangle',0.08,0,260);noise(0.03,0.14,0,'lowpass',900,250);},
  crack(k){if(k==='ice'){tone(2400,0.07,'triangle',0.09,0,3100);noise(0.08,0.08,0,'highpass',4000,6000);}else if(k==='chain'){tone(1250,0.06,'square',0.04);tone(1800,0.07,'square',0.03,0.04);noise(0.05,0.06,0,'highpass',3000,6000);}else{tone(260,0.1,'sine',0.18,0,160);noise(0.08,0.1,0,'bandpass',800,400);}},
  smash(k){noise(0.45+0.12*(k||1),0.38,0,'lowpass',2800,120);tone(120,0.4,'sine',0.38,0,40);tone(240,0.12,'square',0.08,0,90);[1568,2093,2637].forEach((f,i)=>tone(f,0.12,'triangle',0.06,0.03+i*0.04,0,true));},
  knock(){noise(0.018,0.4,0,'bandpass',3200,2400);tone(1650,0.045,'sine',0.2,0,1400);tone(3900,0.03,'sine',0.06,0);tone(240,0.06,'sine',0.22,0,150);},
  chime(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,0.35,'triangle',0.1,i*0.05,0,true));},
  combo(t){const b=[523,659,784,1047][t]||523;[0,4,7,12].forEach((s,i)=>tone(b*Math.pow(2,s/12),0.22,'triangle',0.14,i*0.05,0,true));noise(0.2,0.05,0,'highpass',6000,9000,true);},
  bench(){tone(500,0.12,'sine',0.2);tone(750,0.16,'sine',0.2,0.09,0,true);},
  deny(){tone(120,0.1,'sine',0.3,0,70);noise(0.06,0.14,0,'lowpass',600,200);},
  lose(){tone(392,0.7,'sawtooth',0.12,0,130);tone(196,0.8,'sine',0.18,0,62);noise(0.4,0.07,0,'lowpass',1200,200);},
  win(){[523,659,784,1047,1319].forEach((f,i)=>{tone(f,0.34,'triangle',0.22,i*0.09,0,true);tone(f/2,0.3,'sine',0.1,i*0.09);});[523,659,784].forEach((f)=>tone(f,0.9,'sine',0.1,0.48));noise(0.5,0.06,0.4,'highpass',5000,9000,true);}
};
// titresim: 0 kapali, 1 hafif, 2 orta, 3 guclu
const VIBK=[0,0.55,1,1.7];
function vib(p){const k=VIBK[SV.vib|0]||0;if(!k)return;const now=Date.now();if(typeof p==='number'){if(now-lastVib<45)return;lastVib=now;p=Math.max(4,Math.round(p*k));}else p=p.map((v,i)=>i%2?v:Math.max(4,Math.round(v*k)));try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
// ---------- renk / sekil ----------
function rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(a,b,t){const x=rgb(a),y=rgb(b);return'rgb('+Math.round(x[0]+(y[0]-x[0])*t)+','+Math.round(x[1]+(y[1]-x[1])*t)+','+Math.round(x[2]+(y[2]-x[2])*t)+')';}
function rrc(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const rr=(x,y,w,h,r)=>rrc(ctx,x,y,w,h,r);
function col2rad(c,x,y,r,col){const gr=c.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'#ffffff');gr.addColorStop(0.25,col);gr.addColorStop(1,'rgba(0,0,0,0)');return gr;}
// ---------- durum ----------
let g=null,LV=1,DPR=1,VW=0,VH=0,LY=null,last=0,paused=false,fx=[],pops={},toastT=0,idleT=0,winShown=false,loseShown=false,shake=0,DT=0.016,combo=0,lastHit=-9,boardDirty=true;
const SPR=new Map();
function sprite(key,w,h,draw){let c=SPR.get(key);if(c)return c;c=document.createElement('canvas');c.width=Math.ceil(w*DPR)+2;c.height=Math.ceil(h*DPR)+2;const x=c.getContext('2d');x.scale(DPR,DPR);draw(x,w,h);SPR.set(key,c);if(SPR.size>1500)SPR.clear();return c;}
const PIC={};
function picImg(name){let p=PIC[name];if(p)return p;p=new Image();p.onload=()=>{boardDirty=true;if(g&&g.lv.pic===name)drawGoal();};p.src='../bg/'+name+'.webp';PIC[name]=p;return p;}
// ---------- Pofi (ana oyunun 3B arka gorseli, renge boyanir) ----------
const POFI={img:null,det:null,ready:false,ref:150,cache:{}};
const PF={W:362,H:366,feet:361,tipX:169,tipY:44,badgeY:178};
(function(){let left=2;const ok=()=>{if(--left===0){POFI.ready=true;}};POFI.img=new Image();POFI.img.onload=ok;POFI.img.onerror=ok;POFI.img.src='pofi_back.webp';POFI.det=new Image();POFI.det.onload=ok;POFI.det.onerror=ok;POFI.det.src='pofi_backD.webp';})();
function pofiTint(col){
  let c=POFI.cache[col];if(c!==undefined)return c;
  if(!POFI.ready||!POFI.img.naturalWidth)return null;
  try{const im=POFI.img,w=im.naturalWidth,h=im.naturalHeight;c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,w,h),px=d.data;
    if(!POFI.refDone){const hist=new Uint32Array(256);let tot=0;for(let i=0;i<px.length;i+=4)if(px[i+3]>200){hist[px[i]]++;tot++;}let acc=0;for(let i=0;i<256;i++){acc+=hist[i];if(acc>=tot/2){POFI.ref=i;break;}}POFI.refDone=true;}
    const gm=POFI.ref,n=parseInt(col.slice(1),16);let cr=(n>>16)&255,cg=(n>>8)&255,cb=n&255;
    for(let i=0;i<px.length;i+=4){if(px[i+3]===0)continue;const f=px[i]/gm;let r,gg,b;if(f<=1){const t=0.3+0.7*Math.pow(f,1.25);r=cr*t;gg=cg*t;b=cb*t;const cool=(1-f)*0.35;r*=1-0.28*cool;gg*=1-0.2*cool;}else{const t=Math.min(0.7,(f-1)*1.5);r=cr+(255-cr)*t;gg=cg+(255-cg)*t;b=cb+(255-cb)*t;}px[i]=r>255?255:r;px[i+1]=gg>255?255:gg;px[i+2]=b>255?255:b;}
    x.putImageData(d,0,0);if(POFI.det&&POFI.det.naturalWidth)x.drawImage(POFI.det,0,0,w,h);
  }catch(e){c=null;}
  POFI.cache[col]=c;return c;
}
// kamera yukarida: filler hafif basik gorunur
const SQ=0.86;
// ayaklari (x,y) noktasina gelecek sekilde Pofi ciz; size = gorsel yuksekligi
function drawFil(s,x,y,size,alpha){
  const col=g.pal[s.c],im=pofiTint(col),k=size/PF.H;let sy=SQ,sx=1;
  if(s.fireT!=null&&g.t-s.fireT<0.1){const q=1-(g.t-s.fireT)/0.1;sy*=1-0.1*q;sx*=1+0.06*q;}
  if(s.tapT!=null&&performance.now()-s.tapT<160){const q=1-(performance.now()-s.tapT)/160;sy*=1-0.12*q;sx*=1+0.1*q;}
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y,size*0.3,size*0.08,0,0,7);ctx.fill();
  ctx.translate(x,y);ctx.scale(sx,sy);
  if(im)ctx.drawImage(im,-PF.W*k/2,-PF.feet*k,PF.W*k,PF.H*k);
  else{ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,-size*0.45,size*0.32,0,7);ctx.fill();}
  // sirttaki sayi
  const by=-(PF.feet-PF.badgeY)*k,txt=String(s.ammo),bh=size*0.17,bw=Math.max(size*0.28,size*0.1*txt.length+size*0.14);
  ctx.fillStyle='#fff';ctx.strokeStyle='#20140a';ctx.lineWidth=Math.max(1.5,size*0.022);rr(-bw/2,by-bh/2,bw,bh,bh/2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#20140a';ctx.font='700 '+Math.round(bh*0.8)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,0,by+bh*0.06);
  ctx.restore();
  if(s.fireT!=null&&g.t-s.fireT<0.09){const tp=tipPos(x,y,size);const a=1-(g.t-s.fireT)/0.09;ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=col2rad(ctx,tp.x,tp.y,size*0.22,col);ctx.globalAlpha=a;ctx.beginPath();ctx.arc(tp.x,tp.y,size*0.22,0,7);ctx.fill();ctx.restore();}
}
function tipPos(x,y,size){const k=size/PF.H;return{x:x+(PF.tipX-PF.W/2)*k,y:y-(PF.feet-PF.tipY)*k*SQ};}
// ---------- buz kupu ----------
function sBlock(col,kind){return(c,s)=>{
  const big=s>=22,p=Math.max(0.6,s*0.03),d=Math.max(1,s*0.09),r=s*0.16,fw=s-2*p-d*0.55,fh=s-2*p-d;
  c.fillStyle=mix(col,'#06183a',0.45);rrc(c,p,p,s-2*p,s-2*p,r);c.fill();
  const gr=c.createLinearGradient(p,p,p+fw,p+fh);gr.addColorStop(0,mix(col,'#ffffff',0.5));gr.addColorStop(0.5,mix(col,'#e6f6ff',0.2));gr.addColorStop(1,mix(col,'#9fd4ff',0.06));
  c.fillStyle=gr;rrc(c,p,p,fw,fh,r*0.85);c.fill();
  if(big){c.save();rrc(c,p,p,fw,fh,r*0.85);c.clip();c.fillStyle='rgba(255,255,255,.38)';c.beginPath();c.moveTo(p+fw*0.05,p+fh*0.95);c.lineTo(p+fw*0.3,p+fh*0.95);c.lineTo(p+fw*0.95,p+fh*0.06);c.lineTo(p+fw*0.7,p+fh*0.06);c.closePath();c.fill();c.restore();
    c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=Math.max(1,s*0.03);rrc(c,p+s*0.08,p+s*0.08,fw-s*0.16,fh-s*0.16,r*0.5);c.stroke();}

    if(f.kind==='combo'){const u=1-a,pp=u<0.14?(()=>{const v=u/0.14-1;return 1+2.7*v*v*v+1.7*v*v;})():1,sc=pp*(1+0.035*Math.sin(u*22)),cc=COMBO_COL[f.tier];ctx.save();ctx.globalAlpha=a<0.22?a/0.22:1;ctx.translate(f.x,f.y-u*22);ctx.rotate(-0.07);ctx.scale(sc,sc);const fs=34+f.tier*6;ctx.font='700 '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=10;ctx.strokeStyle='#2a0b3d';ctx.strokeText(f.tx,0,3);ctx.strokeText(f.tx,0,0);const lg=ctx.createLinearGradient(0,-fs/2,0,fs/2);lg.addColorStop(0,cc[0]);lg.addColorStop(1,cc[1]);ctx.fillStyle=lg;ctx.fillText(f.tx,0,0);ctx.restore();continue;}
    f.vy+=(f.g||0)*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;
    ctx.save();ctx.globalAlpha=a;ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.fillStyle=f.c;
    if(f.shape==='tri'){ctx.beginPath();ctx.moveTo(0,-f.r);ctx.lineTo(f.r*0.8,f.r*0.6);ctx.lineTo(-f.r*0.8,f.r*0.6);ctx.closePath();ctx.fill();}
    else if(f.shape==='ring'){ctx.strokeStyle=f.c;ctx.lineWidth=f.r*0.5;ctx.beginPath();ctx.ellipse(0,0,f.r,f.r*0.6,0,0,7);ctx.stroke();}
    else if(f.shape==='star'){ctx.beginPath();for(let k=0;k<5;k++){const a1=k*1.2566-1.57,a2=a1+0.628;ctx.lineTo(Math.cos(a1)*f.r,Math.sin(a1)*f.r);ctx.lineTo(Math.cos(a2)*f.r*0.45,Math.sin(a2)*f.r*0.45);}ctx.closePath();ctx.fill();}
    else if(f.shape==='dot'){ctx.beginPath();ctx.arc(0,0,f.r,0,7);ctx.fill();}
    else ctx.fillRect(-f.r/2,-f.r/3,f.r,f.r*0.66);
    ctx.restore();}
}
function drawKeys(){
  for(const fl of g.flying){const k=fl.key,o=g.objs[k.lock];if(!o)continue;const B=g.B,ax=LY.gx+(k.bc*B+B/2)*LY.cs,ay=LY.gy+(k.br*B+B/2)*LY.cs,r=objRect(o),tx=r.x+r.w/2,ty=r.y+r.h/2;

    ctx.save();ctx.shadowColor='rgba(255,230,120,.9)';ctx.shadowBlur=16;keyIcon(ctx,x,y,Math.max(30,B*LY.cs*0.8),KEYC[o.lid%3],-0.6+e*6.28);ctx.restore();}
}
// ---------- dongu ----------
function frame(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-(last||ts))/1000));last=ts;DT=dt||0.016;
  if(g&&!paused){BZM.step(g,dt);idleT+=dt;handleEvents();
    if(g.state==='win'&&!winShown&&g.t-g.endT>1.0){winShown=true;showWin();}
    if(g.state==='lose'&&!loseShown&&g.t-g.endT>0.8){loseShown=true;showLose();}}
  if(toastT&&performance.now()>toastT){$('toast').classList.remove('on');toastT=0;}
  draw(dt);
  requestAnimationFrame(frame);
}
