<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7a4a22">
<title>Blokpop Buz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1606;--font:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3c2412;font-family:var(--font);color:#1b1030;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;margin:0 auto;max-width:520px;padding:calc(var(--sat) + 6px) 8px 0;display:flex;align-items:center;gap:5px;pointer-events:none;z-index:5}
.ib{pointer-events:auto;flex:none;width:40px;height:40px;border-radius:12px;border:3px solid #3a2208;background:linear-gradient(180deg,#fffaf0,#efe2c8);color:#2b6fd6;font:700 19px/1 var(--font);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #3a2208;cursor:pointer;padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #3a2208}
.ib.sm{width:30px;font-size:14px}
#sign{flex:1;min-width:0;height:42px;border-radius:10px;border:3px solid #3a2208;background:linear-gradient(180deg,#d99a5a,#a8642c);box-shadow:0 3px 0 #3a2208,inset 0 2px 0 rgba(255,235,200,.45);position:relative;display:flex;align-items:center;justify-content:center;font:700 19px/1 var(--font);color:#fff;text-shadow:0 2px 0 #4a2a0e,0 0 3px #4a2a0e;overflow:hidden}
#sign i{position:absolute;left:6px;right:6px;bottom:4px;height:4px;border-radius:3px;background:rgba(60,30,8,.45)}
#sign i b{display:block;height:100%;width:0;border-radius:3px;background:#9ff0ff;transition:width .25s}
#sign:before{content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:9px;background:radial-gradient(circle at 10% 100%,#fff 0 6px,transparent 7px),radial-gradient(circle at 35% 100%,#fff 0 5px,transparent 6px),radial-gradient(circle at 62% 100%,#fff 0 6px,transparent 7px),radial-gradient(circle at 88% 100%,#fff 0 5px,transparent 6px),linear-gradient(#fff,#fff) top/100% 4px no-repeat;opacity:.95}
#goal{flex:none;width:40px;height:40px;border-radius:11px;border:3px solid #3a2208;background:#cfe9ff;box-shadow:0 3px 0 #3a2208}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,4,.6);z-index:20;padding:20px}
.modal.on{display:flex}
.card{width:100%;max-width:360px;background:#fff6e4;border:4px solid #3a2208;border-radius:24px;box-shadow:0 6px 0 #3a2208,0 18px 30px rgba(0,0,0,.4);padding:18px 18px 16px;text-align:center;animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:2px 0 8px;font:700 25px/1.1 var(--font)}
.card p{margin:6px 0 12px;font:500 17px/1.35 var(--font)}
.card canvas{display:block;margin:4px auto 10px;border-radius:14px;border:3px solid #3a2208}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;margin-top:10px;border:3px solid #3a2208;border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--c,#3d9bff);color:#fff;font:700 21px/1 var(--font);text-shadow:0 2px 0 rgba(0,0,0,.28);box-shadow:0 4px 0 #3a2208;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2208}
.btn.g{--c:#43c94f}.btn.o{--c:#ff8c2e}.btn.w{--c:#fff;color:#2a1606;text-shadow:none;height:46px;font-size:18px}
.tag{display:inline-block;margin-bottom:6px;padding:3px 12px;border-radius:99px;border:2.5px solid #3a2208;background:#3d9bff;color:#fff;font:700 14px/1.2 var(--font);text-shadow:0 1px 0 rgba(0,0,0,.3)}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);padding:8px 16px;border-radius:14px;border:3px solid #3a2208;background:#fff6e4;font:700 18px/1 var(--font);opacity:0;transition:opacity .2s;pointer-events:none;z-index:15}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <button class="ib" id="bHome" aria-label="Ana oyun">⌂</button>
  <button class="ib sm" id="bPrev" aria-label="Önceki seviye">◀</button>
  <div id="sign"><span id="signT">Buz 1</span><i><b id="signP"></b></i></div>
  <button class="ib sm" id="bNext" aria-label="Sonraki seviye">▶</button>
  <canvas id="goal" width="80" height="80" aria-label="Hedef resim"></canvas>
  <button class="ib" id="bRe" aria-label="Yeniden başla">↻</button>
  <button class="ib" id="bSnd" aria-label="Ses">🔊</button>
</div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>
<script src="izgara.js"></script>
<script src="motor.js"></script>
<script>
(function(){
'use strict';
BZM.setLib(BZ_IZGARA);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=(id)=>document.getElementById(id);
const KEYC=['#ffc83d','#d6dde8','#ff7fb5'];
const TIPS={
  intro:{t:'Nasıl oynanır?',p:'Filler bantta <b>soldan sağa</b> gider. Her sütunda <b>en alttaki buz</b> (parlak çerçeveli) filin rengindeyse kırılır, arkasındaki resim açılır.<br>Filin sırtındaki sayı <b>atış hakkıdır</b>. Hakkı artan fil <b>bekleme yerine</b> döner; yer kalmazsa kaybedersin.<br><b>İpucu:</b> Sırtındaki sayı, kendi rengindeki parlak buz sayısını geçmeyen fili gönder.'},
  thick:{t:'Yeni: Kalın buz',p:'Kalın buz <b>2 atışta</b> kırılır. İlk atışta çatlar, ikinci atışta resim açılır.'},
  wood:{t:'Yeni: Tahta',p:'Çivili tahtayı <b>her renk fil</b> kırabilir. Altındaki buz sonra kendi rengini ister.'},
  chain:{t:'Yeni: Zincir',p:'Önce <b>zincirin rengindeki</b> fil zinciri kırar. Sonra buz kendi rengiyle kırılır.'},
  lock:{t:'Yeni: Kilit',p:'Kilitli buz <b>vurulamaz</b>. Anahtarı başka bir buzun içinde. O buzu kırınca anahtar uçar ve kilidi açar.'}
};
// ---------- kayit (ana oyunun kaydina dokunmaz) ----------
const SKEY='blokpop_buz_v1';
let SV={L:1,max:1,tips:{},mute:false,best:{}};
try{const d=JSON.parse(localStorage.getItem(SKEY)||'null');if(d&&typeof d==='object')SV=Object.assign(SV,d);}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SV));}catch(e){}}
const qL=/[?&]sv=(\d+)/.exec(location.search);
// ---------- ses ----------
let AC=null;
function ac(){if(SV.mute)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,f2,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),gn=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(vol||0.12,t+0.008);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d+0.02);}
let NB=null;
function noise(d,vol,hp){const a=ac();if(!a)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*0.4,a.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}const t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),gn=a.createGain();s.buffer=NB;f.type=hp?'highpass':'lowpass';f.frequency.value=hp||600;gn.gain.setValueAtTime(vol||0.1,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f).connect(gn).connect(a.destination);s.start(t);s.stop(t+d);}
const PENTA=[523,587,659,784,880,1047,1175,1319];
const SND={
  launch(){tone(220,0.12,'sine',0.09,520);noise(0.08,0.05,0);},
  ice(){noise(0.07,0.09,2600);tone(1500,0.05,'triangle',0.035);},
  shatter(c){noise(0.14,0.12,2200);tone(PENTA[c%PENTA.length],0.18,'triangle',0.06);},
  wood(){tone(150,0.09,'triangle',0.13,90);noise(0.08,0.08,0);},
  chain(){tone(1250,0.06,'square',0.03);tone(1800,0.07,'square',0.025,null,0.04);},
  key(){[1319,1568,2093].forEach((f,i)=>tone(f,0.12,'triangle',0.06,null,i*0.07));},
  unlock(){tone(700,0.05,'square',0.05);tone(1050,0.08,'square',0.04,null,0.05);},
  bench(){tone(440,0.06,'sine',0.05,380);},
  pop(){tone(880,0.07,'sine',0.06,1320);},
  no(){tone(200,0.12,'square',0.04,150);},
  lose(){[392,330,262].forEach((f,i)=>tone(f,0.22,'triangle',0.09,null,i*0.16));},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.2,'triangle',0.08,null,i*0.09));}
};
// ---------- renk / sekil ----------
function rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(a,b,t){const x=rgb(a),y=rgb(b);return'rgb('+Math.round(x[0]+(y[0]-x[0])*t)+','+Math.round(x[1]+(y[1]-x[1])*t)+','+Math.round(x[2]+(y[2]-x[2])*t)+')';}
function rrc(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const rr=(x,y,w,h,r)=>rrc(ctx,x,y,w,h,r);
// ---------- durum ----------
let g=null,LV=1,DPR=1,VW=0,VH=0,LY=null,last=0,paused=false,fx=[],pops={},toastT=0,idleT=0,winShown=false,loseShown=false,shake=0,DT=0.016;
const SPR=new Map();
function sprite(key,w,h,draw){let c=SPR.get(key);if(c)return c;c=document.createElement('canvas');c.width=Math.ceil(w*DPR)+2;c.height=Math.ceil(h*DPR)+2;const x=c.getContext('2d');x.scale(DPR,DPR);draw(x,w,h);SPR.set(key,c);if(SPR.size>1200)SPR.clear();return c;}
const PIC={};
function picImg(name){let p=PIC[name];if(p)return p;p=new Image();p.onload=()=>{SPR.clear();if(g&&g.lv.pic===name)drawGoal();};p.src='../bg/'+name+'.webp';PIC[name]=p;return p;}
// ---------- buz blogu ----------
function sBlock(col,kind){return(c,s)=>{
  const p=s*0.03,d=s*0.09,r=s*0.15,fw=s-2*p-d*0.55,fh=s-2*p-d;
  // kalinlik (alt ve sag yuz)
  const sg=c.createLinearGradient(0,0,s,s);sg.addColorStop(0,mix(col,'#0d2f63',0.25));sg.addColorStop(1,mix(col,'#06183a',0.55));
  c.fillStyle=sg;rrc(c,p,p,s-2*p,s-2*p,r);c.fill();
  // on yuz
  const gr=c.createLinearGradient(p,p,p+fw,p+fh);gr.addColorStop(0,mix(col,'#ffffff',0.5));gr.addColorStop(0.45,mix(col,'#e6f6ff',0.22));gr.addColorStop(1,mix(col,'#9fd4ff',0.08));
  c.fillStyle=gr;rrc(c,p,p,fw,fh,r*0.85);c.fill();
  c.save();rrc(c,p,p,fw,fh,r*0.85);c.clip();
  // buz damarlari
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=Math.max(1,s*0.018);c.beginPath();c.moveTo(p+fw*0.1,p+fh*0.62);c.lineTo(p+fw*0.42,p+fh*0.5);c.lineTo(p+fw*0.58,p+fh*0.78);c.moveTo(p+fw*0.62,p+fh*0.18);c.lineTo(p+fw*0.86,p+fh*0.34);c.stroke();
  // parlak seritler
  c.fillStyle='rgba(255,255,255,.42)';c.beginPath();c.moveTo(p+fw*0.05,p+fh*0.95);c.lineTo(p+fw*0.3,p+fh*0.95);c.lineTo(p+fw*0.95,p+fh*0.06);c.lineTo(p+fw*0.7,p+fh*0.06);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.28)';c.beginPath();c.moveTo(p+fw*0.38,p+fh*0.95);c.lineTo(p+fw*0.46,p+fh*0.95);c.lineTo(p+fw*0.98,p+fh*0.24);c.lineTo(p+fw*0.98,p+fh*0.12);c.closePath();c.fill();
  c.restore();
  // ic don cizgisi ve ust parlaklik
  c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=Math.max(1,s*0.028);rrc(c,p+s*0.07,p+s*0.07,fw-s*0.14,fh-s*0.14,r*0.55);c.stroke();
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=Math.max(1.5,s*0.035);c.lineCap='round';c.beginPath();c.moveTo(p+r*0.9,p+s*0.03);c.lineTo(p+fw-r,p+s*0.03);c.stroke();c.beginPath();c.moveTo(p+s*0.03,p+r);c.lineTo(p+s*0.03,p+fh*0.6);c.stroke();
  c.strokeStyle=mix(col,'#061535',0.6);c.lineWidth=Math.max(1,s*0.024);rrc(c,p,p,s-2*p,s-2*p,r);c.stroke();
  if(kind==='thick'){c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=Math.max(2,s*0.06);rrc(c,p+s*0.14,p+s*0.14,fw-s*0.28,fh-s*0.28,r*0.4);c.stroke();c.fillStyle='rgba(255,255,255,.9)';[[0.22,0.3],[0.72,0.22],[0.3,0.74],[0.78,0.66],[0.5,0.45],[0.6,0.8]].forEach(([a,b])=>{c.beginPath();c.arc(p+fw*a,p+fh*b,s*0.03,0,7);c.fill();});}
  if(kind==='crk'){c.strokeStyle='rgba(20,50,100,.8)';c.lineWidth=Math.max(1.2,s*0.03);c.lineJoin='round';c.beginPath();c.moveTo(p+fw*0.08,p+fh*0.3);c.lineTo(p+fw*0.36,p+fh*0.46);c.lineTo(p+fw*0.5,p+fh*0.36);c.lineTo(p+fw*0.64,p+fh*0.6);c.lineTo(p+fw*0.92,p+fh*0.7);c.moveTo(p+fw*0.5,p+fh*0.36);c.lineTo(p+fw*0.56,p+fh*0.08);c.moveTo(p+fw*0.64,p+fh*0.6);c.lineTo(p+fw*0.52,p+fh*0.92);c.stroke();c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=Math.max(1,s*0.014);c.stroke();}
};}
function plank(c,s,ang){c.save();c.translate(s/2,s/2);c.rotate(ang);const L=s*1.12,w=s*0.23;const gr=c.createLinearGradient(0,-w/2,0,w/2);gr.addColorStop(0,'#e7a862');gr.addColorStop(0.5,'#c9823f');gr.addColorStop(1,'#9c5a22');c.fillStyle=gr;c.strokeStyle='#4a2a0e';c.lineWidth=Math.max(1.2,s*0.03);rrc(c,-L/2,-w/2,L,w,w*0.25);c.fill();c.stroke();c.strokeStyle='rgba(90,45,12,.45)';c.lineWidth=Math.max(1,s*0.015);c.beginPath();c.moveTo(-L*0.4,-w*0.12);c.quadraticCurveTo(-L*0.1,-w*0.3,L*0.15,-w*0.1);c.moveTo(-L*0.15,w*0.18);c.quadraticCurveTo(L*0.1,w*0.05,L*0.38,w*0.2);c.stroke();c.fillStyle='rgba(255,235,200,.35)';c.fillRect(-L/2+w*0.3,-w/2+1.5,L-w*0.6,w*0.15);
  [-1,1].forEach((d)=>{const nx=d*(L/2-w*0.45);c.fillStyle='#8a8f9c';c.beginPath();c.arc(nx,0,w*0.15,0,7);c.fill();c.strokeStyle='#3a3a44';c.lineWidth=1;c.stroke();c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(nx-w*0.04,-w*0.04,w*0.05,0,7);c.fill();});c.restore();}
function sWood(){return(c,s)=>{plank(c,s,0.8);plank(c,s,-0.8);};}
function sChain(col){return(c,s)=>{const n=6;[[0.04,0.04,0.96,0.96],[0.96,0.04,0.04,0.96]].forEach(([x0,y0,x1,y1])=>{const ang=Math.atan2(y1-y0,x1-x0);for(let i=0;i<n;i++){const t=(i+0.5)/n,x=s*(x0+(x1-x0)*t),y=s*(y0+(y1-y0)*t);c.save();c.translate(x,y);c.rotate(ang);const rx=s*0.105,ry=i%2?s*0.035:s*0.065;c.strokeStyle='#1d1406';c.lineWidth=s*0.075;c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);c.stroke();c.strokeStyle=col;c.lineWidth=s*0.045;c.stroke();c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=s*0.015;c.beginPath();c.ellipse(0,-ry*0.3,rx*0.8,ry*0.6,0,Math.PI*1.1,Math.PI*1.9);c.stroke();c.restore();}});
  c.fillStyle=col;c.strokeStyle='#1d1406';c.lineWidth=s*0.03;c.beginPath();c.arc(s/2,s/2,s*0.1,0,7);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.arc(s/2-s*0.03,s/2-s*0.03,s*0.035,0,7);c.fill();};}
function padlock(c,cx,cy,s,kc){const bw=s*0.54,bh=s*0.42,bx=cx-bw/2,by=cy-bh*0.25;c.lineCap='round';c.strokeStyle='#2a1a08';c.lineWidth=s*0.15;c.beginPath();c.arc(cx,by,s*0.17,Math.PI,0);c.stroke();const sg=c.createLinearGradient(cx-s*0.2,0,cx+s*0.2,0);sg.addColorStop(0,'#cfd5df');sg.addColorStop(0.5,'#8d95a6');sg.addColorStop(1,'#c4cad6');c.strokeStyle=sg;c.lineWidth=s*0.085;c.stroke();
  const bg=c.createLinearGradient(0,by,0,by+bh);bg.addColorStop(0,mix(kc,'#ffffff',0.25));bg.addColorStop(0.55,kc);bg.addColorStop(1,mix(kc,'#3a1e06',0.45));c.fillStyle=bg;c.strokeStyle='#2a1a08';c.lineWidth=Math.max(1.5,s*0.04);rrc(c,bx,by,bw,bh,s*0.08);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.35)';rrc(c,bx+bw*0.1,by+bh*0.1,bw*0.8,bh*0.16,bh*0.08);c.fill();
  c.fillStyle='#2a1a08';c.beginPath();c.arc(cx,by+bh*0.45,s*0.055,0,7);c.fill();c.beginPath();c.moveTo(cx-s*0.03,by+bh*0.45);c.lineTo(cx+s*0.03,by+bh*0.45);c.lineTo(cx+s*0.045,by+bh*0.8);c.lineTo(cx-s*0.045,by+bh*0.8);c.closePath();c.fill();}
function sLock(kc){return(c,s)=>{padlock(c,s/2,s/2,s*0.95,kc);};}
function keyIcon(c,x,y,s,kc,rot){c.save();c.translate(x,y);c.rotate(rot||-0.6);c.fillStyle=kc;c.strokeStyle='#2a1a08';c.lineWidth=Math.max(1,s*0.07);c.beginPath();c.arc(-s*0.22,0,s*0.18,0,7);c.fill();c.stroke();rrc(c,-s*0.08,-s*0.06,s*0.46,s*0.12,s*0.05);c.fill();c.stroke();c.fillRect(s*0.2,s*0.04,s*0.08,s*0.12);c.strokeRect(s*0.2,s*0.04,s*0.08,s*0.12);c.fillStyle='#2a1a08';c.beginPath();c.arc(-s*0.22,0,s*0.07,0,7);c.fill();c.restore();}
function sKey(kc){return(c,s)=>{c.save();c.shadowColor='rgba(255,230,120,.9)';c.shadowBlur=s*0.15;keyIcon(c,s/2,s/2,s*0.7,kc,-0.6);c.restore();};}
// ---------- fil (arkadan) ----------
// S: sprite boyutu. Ayaklar S*0.95'te.
const FIL={cx:0.5,cy:0.55,R:0.3};
function sBack(col){return(c,S)=>{
  const cx=S*FIL.cx,cy=S*FIL.cy,R=S*FIL.R,ink='#20140a',lw=Math.max(1.5,S*0.03);
  const dark=mix(col,'#1a0d2a',0.3),light=mix(col,'#ffffff',0.35);
  // golge
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(cx,S*0.94,R*1.05,R*0.2,0,0,7);c.fill();

    const kind=iceN>=2?'thick':cl.crk?'crk':'ice';
    ctx.drawImage(sprite('b|'+cl.c+'|'+kind+'|'+cs,cs,cs,sBlock(g.pal[cl.c],kind)),x,y,cs,cs);
    if(cl.key>=0&&!(g.locks[cl.key]&&g.locks[cl.key].open))ctx.drawImage(sprite('k|'+(cl.key%3)+'|'+cs,cs,cs,sKey(KEYC[cl.key%3])),x,y,cs,cs);
    if(top.t==='wood')ctx.drawImage(sprite('w|'+cs,cs,cs,sWood()),x,y,cs,cs);
    else if(top.t==='chain')ctx.drawImage(sprite('c|'+top.c+'|'+cs,cs,cs,sChain(g.pal[top.c])),x,y,cs,cs);
    else if(top.t==='lock')ctx.drawImage(sprite('l|'+(top.id%3)+'|'+cs,cs,cs,sLock(KEYC[top.id%3])),x,y,cs,cs);
    if(front[c]===r&&g.state==='play'){const a=0.65+0.35*Math.sin(g.t*4+c);ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=Math.max(2,cs*0.06);rr(x+cs*0.04,y+cs*0.04,cs*0.88,cs*0.84,cs*0.14);ctx.stroke();}
  }
}
function drawShots(){
  const {cs}=LY;
  for(const sh of g.shots){
    const k=Math.min(1,(g.t-sh.t0)/(sh.t1-sh.t0)),x=LY.gx+(sh.col+0.5)*cs,bp=beltPos(sh.col+0.5),tip=trunkTip(bp.x,bp.y,LY.beltSize),y0=tip.y,y1=LY.gy+(sh.r+0.6)*cs,y=y0+(y1-y0)*k;
    const col=g.pal[sh.c];
    const tr=ctx.createLinearGradient(0,y,0,Math.min(y0,y+cs*1.6));tr.addColorStop(0,'rgba(255,255,255,.75)');tr.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=tr;ctx.lineWidth=cs*0.14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,Math.min(y0,y+cs*1.6));ctx.lineTo(x,y);ctx.stroke();
    ctx.fillStyle=col;ctx.strokeStyle='#20140a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,cs*0.15,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x-cs*0.04,y-cs*0.05,cs*0.05,0,7);ctx.fill();
  }
}
function gear(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='#8d95a6';ctx.strokeStyle='#2a2a33';ctx.lineWidth=2;ctx.beginPath();for(let k=0;k<16;k++){const a=k/16*Math.PI*2,rr2=k%2?r:r*0.78;ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#c7ccd6';ctx.beginPath();ctx.arc(0,0,r*0.5,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#4a4f5c';ctx.beginPath();ctx.arc(0,0,r*0.2,0,7);ctx.fill();ctx.restore();}
function drawBelt(){
  const {ox,CW,beltY,beltH,cs,gx,W}=LY,y=beltY-beltH/2;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(ox,y+beltH-2,CW,8);
  woodRect(ox,y,CW,beltH,0,'#c88446','#8f5523');
  // bant yuzeyi
  const by=y+beltH*0.18,bh=beltH*0.64;ctx.fillStyle='#6e3f18';ctx.fillRect(ox+beltH*0.5,by,CW-beltH,bh);
  ctx.save();ctx.beginPath();ctx.rect(ox+beltH*0.5,by,CW-beltH,bh);ctx.clip();
  const step=Math.max(26,cs*0.6),off=(g.t*g.speed*cs)%step;ctx.strokeStyle='rgba(255,210,150,.22)';ctx.lineWidth=4;ctx.lineCap='round';
  for(let xx=ox-step+off;xx<ox+CW+step;xx+=step){ctx.beginPath();ctx.moveTo(xx-7,by+bh*0.28);ctx.lineTo(xx,by+bh*0.5);ctx.lineTo(xx-7,by+bh*0.72);ctx.stroke();}
  // sutun cizgileri
  ctx.fillStyle='rgba(255,230,180,.25)';for(let c=0;c<W;c++)ctx.fillRect(gx+(c+0.5)*cs-1,by,2,5);
  ctx.restore();
  ctx.strokeStyle='#3a2208';ctx.lineWidth=2.5;ctx.strokeRect(ox+beltH*0.5,by,CW-beltH,bh);
  ctx.fillStyle='#ffc93d';ctx.strokeStyle='#3a2208';ctx.lineWidth=2;const ax=ox+CW-beltH*1.25,ay=beltY;[0,1].forEach((k)=>{const xx=ax-k*14;ctx.beginPath();ctx.moveTo(xx-6,ay-9);ctx.lineTo(xx+4,ay);ctx.lineTo(xx-6,ay+9);ctx.lineTo(xx-1,ay);ctx.closePath();ctx.fill();ctx.stroke();});
  const gr=beltH*0.42;gear(ox+gr+2,beltY,gr,g.t*g.speed*1.2);gear(ox+CW-gr-2,beltY,gr,g.t*g.speed*1.2);
  // banttaki filler
  const sz=LY.beltSize;
  for(const s of g.belt){
    const p=beltPos(s.x);let x=p.x,yy=p.y,size=sz;
    if(s.launchT!=null&&g.t-s.launchT<0.42&&s.lx!=null){const k=(g.t-s.launchT)/0.42,e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;x=s.lx+(p.x-s.lx)*e;yy=s.ly+(p.y-s.ly)*e-Math.sin(k*Math.PI)*90;size=s.lsz+(sz-s.lsz)*e;}
    s.vx=x;s.vy=yy;s.vsz=size;drawFil(s,x,yy,size);
  }
  if(g.state==='lose'&&g.lostBy){const p=beltPos(W+0.4);drawFil(g.lostBy,p.x,p.y,sz,0.9);ctx.strokeStyle='#ff3d5a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y-sz*0.4,sz*0.55,0,7);ctx.stroke();}
}
function ease(s,tx,ty,tsz,dt){if(s.vx==null){s.vx=tx;s.vy=ty;s.vsz=tsz;return;}const k=1-Math.exp(-dt*14);s.vx+=(tx-s.vx)*k;s.vy+=(ty-s.vy)*k;s.vsz+=(tsz-(s.vsz||tsz))*k;}
function drawShelf(){
  const {ox,CW,shelfTop,shelfH,slots,slotS}=LY;
  woodRect(ox+6,shelfTop,CW-12,shelfH,12,'#7a4520','#5a3215');ctx.strokeStyle='#2e1806';ctx.lineWidth=2.5;rr(ox+6,shelfTop,CW-12,shelfH,12);ctx.stroke();
  const free=g.bench.filter((s)=>!s).length;
  ctx.font='600 13px Fredoka,system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=free===0?'#ff9a9a':'#f6dfc0';
  ctx.fillText('Bekleme yeri  '+free+'/'+g.bench.length+' boş',ox+16,shelfTop+10);
  // en alttaki hedeflerin renk renk sayisi
  const lane=BZM.laneOf(g),cnt={};let wood=0;lane.forEach((v)=>{if(!v)return;if(v.t==='wood')wood++;else if(v.c>=0)cnt[v.c]=(cnt[v.c]||0)+1;});
  const chips=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]).map((c)=>({c,n:cnt[c]}));if(wood)chips.push({c:-1,n:wood});
  let xr=ox+CW-16;const yc=shelfTop+10;ctx.textAlign='right';ctx.font='700 13px Fredoka,system-ui,sans-serif';
  for(let k=chips.length-1;k>=0;k--){const ch=chips[k];ctx.fillStyle='#fff';ctx.fillText('×'+ch.n,xr,yc+1);xr-=ctx.measureText('×'+ch.n).width+9;if(ch.c<0){ctx.fillStyle='#c9823f';ctx.strokeStyle='#2e1806';ctx.lineWidth=1.5;rr(xr-1,yc-6,12,12,3);ctx.fill();ctx.stroke();}else{ctx.fillStyle=g.pal[ch.c];ctx.strokeStyle='#2e1806';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(xr+5,yc,6,0,7);ctx.fill();ctx.stroke();}xr-=10;}
  slots.forEach((p,k)=>{
    ctx.fillStyle=free===0?'rgba(255,80,80,.22)':'rgba(0,0,0,.25)';rr(p.x-slotS/2,p.y-slotS/2,slotS,slotS,12);ctx.fill();ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(255,220,170,.55)';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
    const s=g.bench[k];if(!s)return;ease(s,p.x,p.y+slotS*0.44,LY.benchSize,DT);drawFil(s,s.vx,s.vy,s.vsz);
  });
}
function drawChutes(){
  const {chutes}=LY;
  chutes.forEach((ch,k)=>{
    // oluk: dis cerceve, ic zemin, yan duvarlar
    const wall=Math.max(6,(ch.br-ch.bl)*0.08);
    ctx.fillStyle='#2b1606';ctx.beginPath();ctx.moveTo(ch.tl-3,ch.top);ctx.lineTo(ch.tr+3,ch.top);ctx.lineTo(ch.br+3,ch.bot);ctx.lineTo(ch.bl-3,ch.bot);ctx.closePath();ctx.fill();
    const og=ctx.createLinearGradient(ch.bl,0,ch.br,0);og.addColorStop(0,'#c27a3a');og.addColorStop(0.5,'#d8934f');og.addColorStop(1,'#a8642c');ctx.fillStyle=og;ctx.beginPath();ctx.moveTo(ch.tl,ch.top);ctx.lineTo(ch.tr,ch.top);ctx.lineTo(ch.br,ch.bot);ctx.lineTo(ch.bl,ch.bot);ctx.closePath();ctx.fill();
    const ig=ctx.createLinearGradient(0,ch.top,0,ch.bot);ig.addColorStop(0,'#5a3112');ig.addColorStop(1,'#7a4520');ctx.fillStyle=ig;const iw=wall*0.8;ctx.beginPath();ctx.moveTo(ch.tl+iw*0.8,ch.top+iw);ctx.lineTo(ch.tr-iw*0.8,ch.top+iw);ctx.lineTo(ch.br-iw,ch.bot);ctx.lineTo(ch.bl+iw,ch.bot);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1.5;for(let q=1;q<6;q++){const u=q/6,y=ch.top+(ch.bot-ch.top)*u,l=ch.tl+(ch.bl-ch.tl)*u+iw,r=ch.tr+(ch.br-ch.tr)*u-iw;ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(r,y);ctx.stroke();}
    // top (kanon): oluğun banda bakan ucunda
    const cxm=(ch.tl+ch.tr)/2,cw=(ch.tr-ch.tl)*0.46,cy=ch.top+cw*0.62;
    const cg=ctx.createLinearGradient(cxm-cw/2,0,cxm+cw/2,0);cg.addColorStop(0,'#6f7686');cg.addColorStop(0.45,'#e1e5ec');cg.addColorStop(1,'#5b6170');ctx.fillStyle=cg;ctx.strokeStyle='#22252c';ctx.lineWidth=2;rr(cxm-cw/2,cy-cw*0.55,cw,cw*0.7,cw*0.18);ctx.fill();ctx.stroke();
    ctx.fillStyle='#2b2f38';ctx.beginPath();ctx.ellipse(cxm,cy-cw*0.55,cw*0.42,cw*0.16,0,0,7);ctx.fill();ctx.strokeStyle='#9aa1ae';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#c9823f';ctx.strokeStyle='#22252c';ctx.lineWidth=1.5;rr(cxm-cw*0.58,cy+cw*0.08,cw*1.16,cw*0.16,cw*0.06);ctx.fill();ctx.stroke();
    // filler: arkadakiler once (uzaktan yakina)
    const col=g.queue[k],n=Math.min(col.length,maxInChute(k));
    if(col.length){const p0=chutePos(k,0);const lg=ctx.createRadialGradient(p0.x,p0.y-p0.size*0.05,2,p0.x,p0.y-p0.size*0.05,p0.size*0.6);lg.addColorStop(0,'rgba(255,240,180,.55)');lg.addColorStop(1,'rgba(255,240,180,0)');ctx.fillStyle=lg;ctx.beginPath();ctx.ellipse(p0.x,p0.y-p0.size*0.05,p0.size*0.6,p0.size*0.22,0,0,7);ctx.fill();}
    for(let j=n-1;j>=0;j--){const s=col[j],p=chutePos(k,j);ease(s,p.x,p.y,p.size,DT);drawFil(s,s.vx,s.vy,s.vsz,1);}
    if(col.length>n){const p=chutePos(k,n-1);ctx.fillStyle='#fff';ctx.strokeStyle='#2b1606';ctx.lineWidth=3;ctx.font='700 15px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const tx='+'+(col.length-n);ctx.strokeText(tx,ch.br-14,ch.bot-14);ctx.fillText(tx,ch.br-14,ch.bot-14);}
  });
  // ilk seviyelerde ipucu halkasi
  if(LV<=3&&g.state==='play'&&idleT>3&&!g.belt.length){const bm=BZM.bestMove(g);if(bm){let p;if(bm.from==='q'){const q=chutePos(bm.k,0);p={x:q.x,y:q.y-q.size*0.45,r:q.size*0.6};}else{const sl=LY.slots[bm.k];p={x:sl.x,y:sl.y,r:LY.slotS*0.6};}const a=0.5+0.5*Math.sin(g.t*6);ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.5*a)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,p.r+a*4,0,7);ctx.stroke();}}
}
function drawFx(dt){
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;if(f.t>=f.life){fx.splice(i,1);continue;}
    if(f.kind==='leave'){const k=f.t/f.life;drawFil(f.s,f.x,f.y-k*40,f.size,1-k);ctx.fillStyle='rgba(67,201,79,'+(1-k)+')';ctx.font='700 24px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('✓',f.x,f.y-k*40-f.size*0.95);continue;}
    f.vy+=(f.g||0)*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;const a=1-f.t/f.life;
    ctx.save();ctx.globalAlpha=a;ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.fillStyle=f.c;
    if(f.shape==='tri'){ctx.beginPath();ctx.moveTo(0,-f.r);ctx.lineTo(f.r*0.8,f.r*0.6);ctx.lineTo(-f.r*0.8,f.r*0.6);ctx.closePath();ctx.fill();}
    else if(f.shape==='ring'){ctx.strokeStyle=f.c;ctx.lineWidth=f.r*0.5;ctx.beginPath();ctx.ellipse(0,0,f.r,f.r*0.6,0,0,7);ctx.stroke();}
    else if(f.shape==='star'){ctx.beginPath();for(let k=0;k<5;k++){const a1=k*1.2566-1.57,a2=a1+0.628;ctx.lineTo(Math.cos(a1)*f.r,Math.sin(a1)*f.r);ctx.lineTo(Math.cos(a2)*f.r*0.45,Math.sin(a2)*f.r*0.45);}ctx.closePath();ctx.fill();}
    else ctx.fillRect(-f.r/2,-f.r/3,f.r,f.r*0.66);
    ctx.restore();}
}
function drawKeys(){
  for(const k of g.keys){const lk=g.locks[k.id];if(!lk||!lk.cells.length)continue;const a=cellXY(k.from);let tx=0,ty=0;lk.cells.forEach((i)=>{const p=cellXY(i);tx+=p.x;ty+=p.y;});tx/=lk.cells.length;ty/=lk.cells.length;
    const e=Math.min(1,(g.t-k.t0)/(k.t1-k.t0)),x=a.x+(tx-a.x)*e,y=a.y+(ty-a.y)*e-Math.sin(e*Math.PI)*LY.cs*2;
    ctx.save();ctx.shadowColor='rgba(255,230,120,.9)';ctx.shadowBlur=16;keyIcon(ctx,x,y,LY.cs*0.9,KEYC[k.id%3],-0.6+e*6.28);ctx.restore();}
}
// ---------- dongu ----------
function frame(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-(last||ts))/1000));last=ts;DT=dt||0.016;
  if(g&&!paused){BZM.step(g,dt);idleT+=dt;handleEvents();
    if(g.state==='win'&&!winShown&&g.t-g.endT>1.0){winShown=true;showWin();}
    if(g.state==='lose'&&!loseShown&&g.t-g.endT>0.8){loseShown=true;showLose();}}
  if(toastT&&performance.now()>toastT){$('toast').classList.remove('on');toastT=0;}
  draw(dt);
  requestAnimationFrame(frame);
}
// ---------- dugmeler ----------
$('bHome').onclick=()=>{location.href='../';};
$('bPrev').onclick=()=>{if(LV>1)start(LV-1);};
$('bNext').onclick=()=>{if(LV<200)start(LV+1);};
$('bRe').onclick=()=>{start(LV);};
function updSnd(){$('bSnd').textContent=SV.mute?'🔇':'🔊';$('bSnd').style.fontSize='17px';}
$('bSnd').onclick=()=>{SV.mute=!SV.mute;save();updSnd();};
updSnd();
window.addEventListener('resize',layout);
window.BZ={get g(){return g;},start,M:BZM,pause(v){paused=!!v;}};
start(qL?+qL[1]:SV.L||1);
requestAnimationFrame(frame);
})();
