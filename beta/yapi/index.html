<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f0cb87">
<title>Blokpop Yapı</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,#f0cb87 0,#f0cb87 30%,#7e584a 70%,#4a3028 100%);font-family:var(--font);color:#2b1d5c;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{position:fixed;top:0;left:0;background:url(sahne.webp) top center/100% 100% no-repeat}
#bg:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:22%;background:linear-gradient(180deg,rgba(74,48,40,0),#4a3028)}
#top{position:fixed;left:0;right:0;top:0;max-width:520px;margin:0 auto;padding:calc(var(--sat) + 8px) 10px 0;display:flex;gap:6px;align-items:center;z-index:5}
.ib{flex:none;width:42px;height:42px;border-radius:13px;border:3px solid #2b1d5c;background:#fffaf0;font:700 19px/1 var(--font);color:#2b1d5c;box-shadow:0 3px 0 #2b1d5c}
.ib.sm{width:32px}
#sign{flex:1;min-width:0;height:46px;border-radius:14px;border:3px solid #2b1d5c;background:linear-gradient(180deg,#ffd27a,#ff9f3a);box-shadow:0 3px 0 #2b1d5c;position:relative;text-align:center;padding-top:3px}
#sign small{display:block;font:600 11px/1 var(--font);letter-spacing:1px;color:#5a2a00}#sign b{display:block;font:700 18px/1.15 var(--font);color:#fff;text-shadow:0 2px 0 rgba(90,40,0,.5)}
#sign i{position:absolute;left:8px;right:8px;bottom:4px;height:4px;border-radius:3px;background:rgba(90,40,0,.3)}#pb{display:block;height:100%;width:0;border-radius:3px;background:#fff;transition:width .2s}
#bot{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:8px 8px calc(var(--sab) + 8px);z-index:5}
#bn{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.bs{width:54px;height:54px;border-radius:15px;border:3px solid #3a2140;background:rgba(255,245,230,.38);box-shadow:inset 0 2px 6px rgba(0,0,0,.18);padding:0;display:flex;align-items:center;justify-content:center}
#qs{display:flex;gap:8px}
.qc{flex:1;height:132px;border:0;border-radius:6px;background:url(kart.webp) center/100% 100% no-repeat;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));padding:20px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.pf{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:13px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,0) 45%),var(--c);border:3px solid #2b1d5c;font-style:normal}
.pf b{font:700 17px/1 var(--font);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.pf.bk{width:32px;height:32px;opacity:.85;border-width:2px;border-radius:10px}.pf.bk b{font-size:13px}
.qc em{position:absolute;bottom:14px;right:16px;color:#7a5a3a;font:700 12px/1 var(--font);font-style:normal;color:#7a6aa8}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,60,.45);z-index:20;padding:20px}.modal.on{display:flex}
.card{width:100%;max-width:340px;background:#fffaf0;border:4px solid #2b1d5c;border-radius:24px;box-shadow:0 6px 0 #2b1d5c;padding:18px;text-align:center}
.card h2{margin:4px 0 8px;font:700 26px/1.1 var(--font)}.card p{font:500 16px/1.35 var(--font);margin:6px 0 12px}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;border:2.5px solid #2b1d5c;background:#3d9bff;color:#fff;font:700 14px/1.2 var(--font)}.tag.r{background:#f04848}
.btn{display:block;width:100%;height:52px;margin-top:10px;border:3px solid #2b1d5c;border-radius:16px;background:var(--c,#43c94f);color:#fff;font:700 20px/1 var(--font);text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 4px 0 #2b1d5c}.btn.o{--c:#ff8c2e}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);padding:8px 16px;border-radius:14px;border:3px solid #2b1d5c;background:#fffaf0;font:700 20px/1 var(--font);opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}#toast.on{opacity:1}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="gl"></canvas>
<div id="top"><button class="ib" id="home" aria-label="Ana oyun">⌂</button><button class="ib sm" id="prev" aria-label="Önceki">◀</button>
<div id="sign"><small id="lv">Yapı 1</small><b id="nm">İkiz Kuleler</b><i><span id="pb"></span></i></div>
<button class="ib sm" id="next" aria-label="Sonraki">▶</button><button class="ib" id="re" aria-label="Yeniden">↻</button></div>
<div id="bot"><div id="bn"></div><div id="qs"></div></div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>
<script src="motor.js?v=3"></script>
<script type="module" src="oyun.js?v=5"></script>
</body>
</html>
