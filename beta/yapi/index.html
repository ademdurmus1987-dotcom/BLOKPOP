<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7cc6ff">
<title>Blokpop Yapı</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#7cc6ff;font-family:var(--font);color:#2b1d5c;touch-action:none}
#bg{position:fixed;inset:0;background:#7cc6ff center/cover no-repeat;transition:background-image .4s;filter:saturate(1.25) brightness(1.06) contrast(1.04)}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0) 40%,rgba(30,20,70,.1) 100%)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;max-width:520px;margin:0 auto;padding:calc(var(--sat) + 10px) 12px 0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.topc{width:84px;border-radius:18px;background:linear-gradient(180deg,#c8283c,#8e1426);border:3px solid #5a0c18;box-shadow:0 4px 0 #5a0c18,inset 0 2px 0 rgba(255,255,255,.35);padding:3px 5px 6px;text-align:center}
.topc small{display:block;font:700 16px/1.1 var(--font);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);padding:1px 0 3px}
.topc b{display:block;border-radius:12px;background:linear-gradient(180deg,#ffffff,#ece4f3);font:700 34px/1.25 var(--font);color:#9b1a2e;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.mid{flex:1;min-width:0;padding-top:6px;text-align:center}
.lvp{display:inline-block;padding:5px 14px;border-radius:99px;background:rgba(36,26,99,.72);color:#fff;font:600 14px/1.1 var(--font);white-space:nowrap}
.lvp b{font-weight:700;color:#ffe36b}
.rb{display:flex;flex-direction:column;gap:8px}
.ib{width:52px;height:52px;border-radius:50%;border:3px solid #f2c24a;background:radial-gradient(circle at 50% 35%,#d4344a,#8e1426);font:700 24px/1 var(--font);color:#fff;box-shadow:0 4px 0 #5a0c18;padding:0;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ib:active{transform:translateY(2px);box-shadow:0 2px 0 #5a0c18}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.3);color:#ff8a00}}
#prog{margin:8px auto 0;max-width:190px;height:10px;border-radius:6px;background:rgba(36,26,99,.55);border:2px solid #241a63;overflow:hidden}
#pb{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a2e);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width .3s}
#nm{position:absolute;left:0;right:0;top:calc(var(--sat) + 76px);text-align:center;font:700 17px/1 var(--font);color:#fff;text-shadow:0 2px 0 #241a63,0 0 8px rgba(36,26,99,.6);z-index:4;pointer-events:none}
#hint{position:fixed;left:50%;white-space:nowrap;bottom:calc(var(--sab) + 26px);transform:translateX(-50%);padding:9px 18px;border-radius:99px;background:rgba(36,26,99,.78);color:#fff;font:700 17px/1 var(--font);z-index:4;pointer-events:none;animation:pulse 1.4s infinite;transition:opacity .3s}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
#praise{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:6;pointer-events:none}
#praise .p{display:inline-block;font:700 50px/1 var(--font);color:#fff;-webkit-text-stroke:3px #7a1f00;paint-order:stroke fill;text-shadow:0 5px 0 #7a1f00,0 0 24px rgba(255,180,40,.9);animation:pop 1.3s forwards}
#praise .p i{display:block;font:700 20px/1.3 var(--font);font-style:normal;-webkit-text-stroke:2px #241a63;text-shadow:0 3px 0 #241a63}
#praise .p.g1{background:linear-gradient(180deg,#fff27a,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}18%{transform:scale(1.25) rotate(4deg);opacity:1}30%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(.9) translateY(-40px)}}
.fl{position:fixed;z-index:6;pointer-events:none;font:700 24px/1 var(--font);color:#ffe36b;-webkit-text-stroke:2px #241a63;paint-order:stroke fill;animation:fl .9s forwards}
@keyframes fl{0%{transform:translate(-50%,0) scale(.5);opacity:0}25%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,20,70,.5);z-index:20;padding:20px}.modal.on{display:flex}
.card{width:100%;max-width:340px;background:linear-gradient(180deg,#fffaf0,#ffe9c7);border:4px solid #241a63;border-radius:26px;box-shadow:0 7px 0 #241a63;padding:20px;text-align:center;animation:cin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes cin{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card h2{margin:6px 0 6px;font:700 30px/1.1 var(--font)}.card p{font:500 17px/1.35 var(--font);margin:6px 0 10px}
.stars{font-size:40px;letter-spacing:4px;filter:drop-shadow(0 3px 0 #241a63)}
.tag{display:inline-block;padding:4px 14px;border-radius:99px;border:2.5px solid #241a63;background:#5b6dff;color:#fff;font:700 15px/1.2 var(--font)}.tag.r{background:#f04848}
.btn{display:block;width:100%;height:54px;margin-top:10px;border:3px solid #241a63;border-radius:18px;background:var(--c,#43c94f);color:#fff;font:700 21px/1 var(--font);text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 5px 0 #241a63,inset 0 3px 0 rgba(255,255,255,.35)}.btn.o{--c:#ff8c2e}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #241a63}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:rgba(124,198,255,.6);font:700 22px/1 var(--font);color:#fff;text-shadow:0 2px 0 #241a63;transition:opacity .4s}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="gl"></canvas>
<div id="top">
<div class="topc"><small>Top</small><b id="tc">0</b></div>
<div class="mid"><div class="lvp"><span id="lv">Yapı</span> <b id="lvn">1</b> · Küp <b id="kc">0</b></div><div id="prog"><span id="pb"></span></div></div>
<div class="rb"><button class="ib" id="home" aria-label="Ana oyun">⌂</button><button class="ib" id="re" aria-label="Yeniden">↻</button></div>
</div>
<div id="nm"></div>
<div id="hint">Yapıya dokun, ateş et!</div>
<div id="praise"></div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div id="load">Yükleniyor…</div>
<script type="module" src="oyun.js?v=17"></script>
</body>
</html>
