<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<base href="../yapi/">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f8fd8">
<title>Blokpop Korsan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--disp:"Lilita One","Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;--font:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#7cc6ff;font-family:var(--font);color:#2b1d5c;touch-action:none}
#bg{position:fixed;inset:0;background:#7cc6ff center/cover no-repeat;transition:background-image .4s;filter:saturate(1.25) brightness(1.06) contrast(1.04)}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0) 40%,rgba(30,20,70,.1) 100%)}
#canli{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;filter:saturate(1.25) brightness(1.06) contrast(1.04)}
#onfx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;max-width:520px;margin:0 auto;padding:calc(var(--sat) + 10px) 12px 0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.topc{width:84px;border-radius:18px;background:linear-gradient(180deg,#c8283c,#8e1426);border:3px solid #5a0c18;box-shadow:0 4px 0 #5a0c18,inset 0 2px 0 rgba(255,255,255,.35);padding:3px 5px 6px;text-align:center}
.topc small{display:block;font:700 16px/1.1 var(--font);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);padding:1px 0 3px}
.topc b{display:block;border-radius:12px;background:linear-gradient(180deg,#ffffff,#ece4f3);font:700 34px/1.25 var(--font);color:#9b1a2e;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.mid{flex:1;min-width:0;padding-top:6px;text-align:center}
.lvp{display:inline-block;padding:5px 14px;border-radius:99px;background:rgba(36,26,99,.72);color:#fff;font:600 14px/1.1 var(--font);white-space:nowrap}
.lvp b{font-weight:700;color:#ffe36b}
.rb{display:flex;flex-direction:column;gap:8px}
.ib{width:52px;height:52px;border-radius:50%;border:3px solid #f2c24a;background:radial-gradient(circle at 50% 35%,#d4344a,#8e1426);font:700 24px/1 var(--font);color:#fff;box-shadow:0 4px 0 #5a0c18;padding:0;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ib:active{transform:translateY(2px);box-shadow:0 2px 0 #5a0c18}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.3);color:#ff8a00}}
#prog{margin:8px auto 0;max-width:190px;height:10px;border-radius:6px;background:rgba(36,26,99,.55);border:2px solid #241a63;overflow:hidden}
#pb{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a2e);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width .3s}
/* v6.3 yazilar: tok "Lilita One" yazi tipi, kalin koyu kontur + alt golge, parlak renk gecisi; Royal Smash tarzi */
.topc small,.lvp,.ib{font-family:var(--disp)!important;letter-spacing:.3px}
.topc b{font-family:var(--disp)!important;font-weight:400!important}
.lvp b{font-weight:400}
#nm{position:fixed;left:50%;top:auto;bottom:calc(var(--sab) + 120px);transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;opacity:0;white-space:nowrap}
#nm.on{animation:ban 2.1s cubic-bezier(.2,1.4,.4,1) forwards}
#nm .rb1{position:relative;display:inline-block;padding:10px 34px 12px;background:linear-gradient(180deg,#ff5a6e,#c8143a);border:4px solid #6a0a22;border-radius:14px;box-shadow:0 6px 0 #6a0a22,inset 0 3px 0 rgba(255,255,255,.45)}
#nm .rb1:before,#nm .rb1:after{content:"";position:absolute;top:14px;width:26px;height:100%;background:#a8102e;border:4px solid #6a0a22;z-index:-1}
#nm .rb1:before{left:-20px;border-radius:8px 0 0 8px}#nm .rb1:after{right:-20px;border-radius:0 8px 8px 0}
#nm small{display:block;font:400 15px/1 var(--disp);color:#ffe9a8;letter-spacing:1px;text-shadow:0 2px 0 #6a0a22}
#nm b{display:block;font:400 30px/1.15 var(--disp);color:#fff;text-shadow:0 3px 0 #6a0a22,0 0 2px #6a0a22}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-6deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(1deg)}22%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
#hint{position:fixed;left:50%;white-space:nowrap;bottom:calc(var(--sab) + 30px);transform:translateX(-50%);padding:10px 22px 11px 50px;border-radius:99px;background:linear-gradient(180deg,rgba(60,40,140,.92),rgba(36,22,100,.92));border:3px solid rgba(255,255,255,.85);color:#fff;font:400 19px/1 var(--disp);letter-spacing:.4px;text-shadow:0 2px 0 rgba(0,0,0,.35);z-index:4;pointer-events:none;transition:opacity .3s;box-shadow:0 5px 14px rgba(20,10,60,.35)}
#hint:before{content:"👆";position:absolute;left:16px;top:50%;font-size:24px;transform:translateY(-50%);animation:tap 1s infinite}
@keyframes tap{50%{transform:translateY(-30%) scale(.85)}}
#praise{position:fixed;left:0;right:0;top:27%;text-align:center;z-index:6;pointer-events:none}
#praise .p{position:relative;display:inline-block;animation:pop 1.5s cubic-bezier(.2,1.5,.4,1) forwards}
#praise .p:before{content:"";position:absolute;left:50%;top:45%;width:260px;height:260px;margin:-130px 0 0 -130px;background:repeating-conic-gradient(rgba(255,240,150,.55) 0 10deg,rgba(255,240,150,0) 10deg 30deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);z-index:-1;animation:spin 3s linear infinite}
#praise .p b{display:block;font:400 62px/1 var(--disp);letter-spacing:1px;color:#ffd83a;text-shadow:-3px 0px 0 #4a1600,3px 0px 0 #4a1600,0px -3px 0 #4a1600,0px 3px 0 #4a1600,-2px -2px 0 #4a1600,2px -2px 0 #4a1600,-2px 2px 0 #4a1600,2px 2px 0 #4a1600,0 6px 0 #4a1600,0 8px 14px rgba(0,0,0,.35)}
#praise .p.big b{font-size:74px}
#praise .p i{display:block;margin-top:8px;font:400 24px/1.2 var(--disp);font-style:normal;color:#fff;text-shadow:-2px 0 0 #2a1666,2px 0 0 #2a1666,0 -2px 0 #2a1666,0 2px 0 #2a1666,0 4px 0 #2a1666}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.1) rotate(-14deg);opacity:0}16%{transform:scale(1.22) rotate(4deg);opacity:1}28%{transform:scale(.96) rotate(-1deg)}36%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05) translateY(-46px)}}
.fl{position:fixed;z-index:6;pointer-events:none;font:400 30px/1 var(--disp);color:#fff;text-shadow:-2px 0 0 #2a1666,2px 0 0 #2a1666,0 -2px 0 #2a1666,0 2px 0 #2a1666,0 4px 0 #2a1666;animation:fl 1s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
.fl.gold{color:#ffe14a}
.fl.blue{color:#9fe6ff}
@keyframes fl{0%{transform:translate(-50%,0) scale(.3);opacity:0}25%{transform:translate(-50%,-18px) scale(1.2);opacity:1}45%{transform:translate(-50%,-24px) scale(1)}100%{transform:translate(-50%,-70px) scale(.95);opacity:0}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(40,20,100,.45),rgba(10,5,40,.75));z-index:20;padding:22px}.modal.on{display:flex}
.card{position:relative;width:100%;max-width:330px;background:linear-gradient(180deg,#fff8e8,#ffe2b0);border:5px solid #4a1f6e;border-radius:30px;box-shadow:0 9px 0 #4a1f6e,0 18px 40px rgba(0,0,0,.35),inset 0 4px 0 #fff;padding:58px 20px 20px;text-align:center;animation:cin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes cin{0%{transform:scale(.3) translateY(40px);opacity:0}100%{transform:scale(1);opacity:1}}
.card .rib{position:absolute;left:-18px;right:-18px;top:-26px;padding:12px 0 14px;background:linear-gradient(180deg,#ffd84a,#ff9f1c);border:5px solid #4a1f6e;border-radius:18px;box-shadow:0 6px 0 #4a1f6e,inset 0 3px 0 rgba(255,255,255,.6);font:400 34px/1 var(--disp);color:#fff;-webkit-text-stroke:2px #8a3a00;paint-order:stroke fill;text-shadow:0 3px 0 #8a3a00;letter-spacing:1px}
.card .rib.r{background:linear-gradient(180deg,#ff7a8a,#d61f45);-webkit-text-stroke-color:#6a0a22;text-shadow:0 3px 0 #6a0a22}
.stars{display:flex;justify-content:center;gap:4px;margin:0 0 8px}
.stars span{font-size:52px;line-height:1;color:#ffcf2e;-webkit-text-stroke:2.5px #8a4a00;filter:drop-shadow(0 4px 0 #8a4a00);opacity:0;animation:star .5s cubic-bezier(.2,1.8,.4,1) forwards}
.stars span.off{color:#d8c6a8;-webkit-text-stroke-color:#a08a6a;filter:drop-shadow(0 4px 0 #a08a6a)}
.stars span:nth-child(2){font-size:64px;margin-top:-10px;animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}.stars span:nth-child(1){animation-delay:0s}
@keyframes star{0%{opacity:0;transform:scale(2.4) rotate(-30deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.card h2{margin:4px 0 4px;font:400 28px/1.1 var(--disp);color:#4a1f6e;letter-spacing:.5px}
.card p{font:600 17px/1.35 var(--font);color:#6a4a7e;margin:4px 0 12px}
.card .stat{display:flex;justify-content:center;gap:10px;margin:6px 0 12px}
.card .stat div{flex:1;max-width:120px;padding:8px 6px;border-radius:14px;background:#fff;border:3px solid #e8c88a;font:400 13px/1.1 var(--disp);color:#9a7a4a;letter-spacing:.5px}
.card .stat b{display:block;font:400 26px/1.1 var(--disp);color:#4a1f6e}
.tag{display:none}
.btn{display:block;width:100%;height:58px;margin-top:10px;border:4px solid #1f5e14;border-radius:20px;background:linear-gradient(180deg,#8cf05a,#3fb82a);color:#fff;font:400 26px/1 var(--disp);letter-spacing:.8px;-webkit-text-stroke:1.5px #1f5e14;paint-order:stroke fill;text-shadow:0 3px 0 #1f5e14;box-shadow:0 6px 0 #1f5e14,inset 0 4px 0 rgba(255,255,255,.45)}
.btn.o{background:linear-gradient(180deg,#ffc34a,#ff8a1c);border-color:#8a3a00;-webkit-text-stroke-color:#8a3a00;text-shadow:0 3px 0 #8a3a00;box-shadow:0 6px 0 #8a3a00,inset 0 4px 0 rgba(255,255,255,.45)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f5e14}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:rgba(124,198,255,.6);font:700 22px/1 var(--font);color:#fff;text-shadow:0 2px 0 #241a63;transition:opacity .4s}
/* korsan modu */
html,body{background:#2f8fd8}
#bg{transition:background-image .4s,transform .25s linear;transform-origin:50% 50%}
.au{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 12px 4px 6px;border-radius:99px;background:rgba(36,26,99,.72);color:#ffe36b;font:400 17px/1 var(--disp);letter-spacing:.4px}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23f 45%,#d99a10 75%);border:2px solid #9a6400;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.kz{display:inline-flex;align-items:center;gap:10px;margin:2px 0 0;padding:8px 18px;border-radius:16px;background:#fff;border:3px solid #e8c88a}
.kz .coin{width:30px;height:30px}.kz b{font:400 32px/1 var(--disp);color:#c88a00;-webkit-text-stroke:1px #8a4a00}
.kz.pop{animation:bump .35s}
.kasa{margin:6px 0 2px!important;font:400 16px/1 var(--disp)!important;color:#9a7a4a!important;letter-spacing:.4px}.kasa b{color:#4a1f6e}
.sdk{margin:8px auto 0;cursor:pointer;width:150px}.sdk svg{display:block;margin:0 auto;overflow:visible;animation:sal 1.2s ease-in-out infinite}
.sdk small{display:block;font:400 18px/1.1 var(--disp);color:#8a3a00;letter-spacing:.4px}
.sdk .kp{transform-origin:14px 46px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}.sdk .ic{opacity:0;transition:opacity .2s .15s}
.sdk.acik .kp{transform:rotate(-38deg) translate(-6px,-10px)}.sdk.acik .ic{opacity:1}.sdk.acik svg{animation:none}
@keyframes sal{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.04)}}
.coin.ucan{position:fixed;z-index:30;pointer-events:none;animation:ucan 1.1s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes ucan{0%{transform:translate(-50%,-50%) scale(.4)}40%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1)}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 160px)) scale(.9);opacity:0}}
.card.harita{max-width:350px;padding-top:50px;background:linear-gradient(180deg,#f6e3b4,#e9c98a)}
.card.harita .bl{margin:0 0 6px!important;font:400 17px/1 var(--disp)!important;color:#8a4a1e!important;letter-spacing:.4px}
.map{display:block;width:100%;height:auto;border-radius:16px;box-shadow:inset 0 0 0 3px #8a4a1e}
.map .adalar ellipse{fill:#f3dca0;stroke:#7cc444;stroke-width:4}
.map .nd circle{fill:#fff8e8;stroke:#8a4a1e;stroke-width:3}.map .nd text{font:400 14px var(--disp);fill:#8a4a1e;text-anchor:middle}
.map .nd.ok circle{fill:#ffd23f}.map .nd.cur circle{fill:#8cf05a;stroke:#1f5e14}.map .nd.boss circle{fill:#3a2a4a;stroke:#1a0f24}.map .nd.boss text{fill:#fff;font-size:17px}
.map .nd.kilit{opacity:.45}.map .ys{font-size:9px!important;fill:#e8a000!important}.map .pus{font:400 16px var(--disp);fill:#8a4a1e;text-anchor:middle}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="canli"></canvas>
<canvas id="gl"></canvas>
<canvas id="onfx"></canvas>
<div id="top">
<div class="topc"><small>Top</small><b id="tc">0</b></div>
<div class="mid"><div class="lvp"><span id="lv">Yapı</span> <b id="lvn">1</b> · Küp <b id="kc">0</b></div><div id="prog"><span id="pb"></span></div><div class="au"><i class="coin"></i><b id="au">0</b></div></div>
<div class="rb"><button class="ib" id="home" aria-label="Ana oyun">⌂</button><button class="ib" id="re" aria-label="Yeniden">↻</button><button class="ib" id="hr" aria-label="Harita">🗺</button></div>
</div>
<div id="nm"></div>
<div id="hint">Dokun ve ateş et!</div>
<div id="praise"></div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div id="load">Yükleniyor…</div>
<script>window.KORSAN = true;</script>
<script type="module" src="oyun.js?v=37"></script>
</body>
</html>
