function peelOrder(grid){
const g=grid.map((r)=>r.slice());
let left=0;
g.forEach((r)=>r.forEach((v)=>{if(v>=0)left++;}));
const out=[];
while(left>0){
const ex=exposedCells(g,null);
const by={};
ex.forEach((e)=>{(by[e.col]=by[e.col]||[]).push(e);});
let best=-1,bc=-1;
Object.keys(by).map(Number).sort((a,b)=>a-b).forEach((k)=>{if(by[k].length>bc){bc=by[k].length;best=k;}});
out.push({col:best,count:bc});
by[best].forEach((e)=>{g[e.r][e.c]=-1;left--;});
}

}
function chunks(n,minA,maxA,rng){
const out=[];
while(n>maxA){
let s=minA+Math.floor(rng()*(maxA-minA+1));
s=Math.max(1,Math.min(s,n-minA));
out.push(s);n-=s;
}

}

if(Object.keys(have).length>=want)break;

case'pack':toast(t('soonMsg'));break;
case'daily':claimDaily(el);break;
case'wtab':wTab=el.getAttribute('data-s');renderChar();break;

}

var onDown=function(e){

ensureAudio();
var r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;
var x=(p.clientX-r.left)*(BP.CW/r.width),y=(p.clientY-r.top)*(BP.CH/r.height);

if(res){
launches++;
if(launches>=2&&!S.tutorialDone){S.tutorialDone=true;$('hint').className='hint hidden';save();}
}
if(e.cancelable)e.preventDefault();
};

},90);

}

}
