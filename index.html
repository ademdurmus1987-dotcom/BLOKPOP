else btn='<button class="btn b-yellow" data-act="buyItem" data-s="'+wTab+'" data-id="'+it.id+'">'+ico('coin')+'&nbsp;'+it.price+'</button>';
h+='<div class="wi'+(eq?' eq':'')+'"><div class="wp">'+EL.svg(st,pv,{face:true,noShadow:true})+'</div><b>'+it[S.set.lang]+'</b>'+btn+'</div>';
});
h+='</div>';
$('charScroll').innerHTML=h;
}
function findItem(slot,id){var a=EL.ITEMS[slot];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function wear(slot,id){
S.equip[slot]=S.equip[slot]===id?null:id;save();syncSkin();SFX.slot();vib(12);
renderChar();refreshHeader();
}
function buyItem(slot,id){
var it=findItem(slot,id);if(!it)return;
if(stageNow()<it.stage)return;
if(S.coins<it.price){toast(t('needCoins'));SFX.error();return;}
S.coins-=it.price;S.owned[id]=true;S.equip[slot]=id;syncSkin();S.stats.purchases++;track('purchase',{item:id});save();
refreshCoins();SFX.buy();vib([15,30,15]);bump('pill1');
var p=centerOf($('bigEle'));confetti(p.x,p.y,34,380);
renderChar();refreshHeader();
}
var cv,ctx,view={w:380,h:600,dpr:1,scale:1};
function resize(){
var st=$('stage');if(!st||cur!=='game')return;
var w=st.clientWidth,h=st.clientHeight;if(w<10||h<10)return;
BP.setGeom(w/h);
var scale=Math.min(w/BP.CW,h/BP.CH),dpr=Math.min(window.devicePixelRatio||1,2.5);
var cw=Math.floor(BP.CW*scale),ch=Math.floor(BP.CH*scale);
cv.style.width=cw+'px';cv.style.height=ch+'px';
cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
view.scale=cw/BP.CW;view.dpr=dpr;
ctx.setTransform(cv.width/BP.CW,0,0,cv.height/BP.CH,0,0);
}
function syncSkin(){try{BP.setSkin({head:S.equip.head,face:S.equip.face,neck:S.equip.neck,ear:S.equip.ear,stage:stageNow()});}catch(e){}}
function startLevel(L){
syncSkin();
closeAll();
curLevel=L;
var g=['#3b4070','#2a2e58'],gm=$('game');
gm.style.setProperty('--g1',g[0]);gm.style.setProperty('--g2',g[1]);
BP.start(L);
var ls=lvStat(L);ls.p++;S.stats.plays++;
track('level_start',{L:L});
save();
$('gameLv').textContent=t('level',{n:L});
$('prog').style.width='0%';
$('hint').className='hint'+(!S.tutorialDone&&L===1?'':' hidden');
refreshBoosters();
show('game');
}
var launches=0;
BP.hooks.sfx=function(n,a){ensureAudio();if(SFX[n])SFX[n](a);};
BP.hooks.vib=vib;
BP.hooks.toast=function(m){toast(m==='full'?t('beltFull'):m);};
BP.hooks.gift=function(r){
S.coins+=r.coins;S.stats.gifts=(S.stats.gifts|0)+1;save();refreshCoins();
SFX.coin(2);setTimeout(function(){SFX.coin(5);},120);vib([20,30,40]);
toast('🎁 +'+r.coins);
};
BP.hooks.onWin=function(r){
var L=r.L,ls=lvStat(L),first=!(S.stars[L]>0),preStage=stageNow(),preStars=totalStars();
var base=first?CONFIG.rewardFirst+CONFIG.rewardPerStar*r.stars:CONFIG.rewardReplay;
var bonus=bonusPct(preStage),reward=Math.round(base*(1+bonus/100));
if(r.stars>(S.stars[L]|0))S.stars[L]=r.stars;
var startShown=S.coins;
S.coins+=reward;S.stats.wins++;ls.w++;ls.best=Math.max(ls.best,r.stars);ls.tm+=Math.round(r.time);
if(L>=S.unlocked&&L<BP.TOTAL_LEVELS)S.unlocked=L+1;
S.tutorialDone=true;S.stats.wins_since_ad++;
var newStars=totalStars(),newStage=EL.stageFor(newStars),evolved=newStage>S.stage;
track('level_win',{L:L,stars:r.stars,peak:r.peak,time:Math.round(r.time),revives:r.revives,first:first});
save();
setShown(startShown);
$('winEle').innerHTML=eleSvg(preStage,{mood:'happy'});
$('winBanner').textContent=t('winBanner',{n:L});
$('winReward').textContent='+'+reward;
$('winSub').textContent=(first?t('tFirst'):t('replayNote'))+(r.gift?'  ·  🎁 +'+r.gift:'')+(bonus?'  ·  '+t('bonusTxt',{n:bonus}):'');
$('btnNext').className='btn b-green big'+(L>=BP.TOTAL_LEVELS?' hidden':'');
var sh='';
for(var i=1;i<=3;i++)sh+='<svg class="ic'+(i<=r.stars?' on':'')+'" style="animation-delay:'+(0.25+i*0.3)+'s"><use href="#i-star"/></svg>';
$('winStars').innerHTML=sh;
var S0=EL.STAGES[preStage-1],nx=EL.STAGES[preStage]||null,bar=$('winXp');
function pctOf(v,stg){var a=EL.STAGES[stg-1],b=EL.STAGES[stg];return b?Math.max(4,Math.min(100,(v-a.stars)/(b.stars-a.stars)*100)):100;}
var fi=bar.children?bar.children[0]:null,fsp=bar.children?bar.children[1]:null;
if(fi){fi.style.width=pctOf(preStars,preStage).toFixed(0)+'%';}
if(fsp)fsp.innerHTML=ico('star')+(nx?newStars+' / '+nx.stars:newStars+' · '+t('maxStage'));
openModal('mWin');
SFX.win();vib([30,40,30,40,90]);
var c0=centerOf($('winEle'));confetti(c0.x,c0.y+30,50,520);
setTimeout(function(){if(fi)fi.style.width=(evolved?100:pctOf(newStars,preStage)).toFixed(0)+'%';},500);
for(var s=0;s<r.stars;s++)(function(s){setTimeout(function(){SFX.star(s);vib(18);},560+s*300);})(s);
setTimeout(function(){
var rp=centerOf($('winReward'));
flyCoins(rp.x,rp.y,'pill3',Math.max(5,Math.min(14,Math.round(reward/4))),reward,function(){
if(evolved)setTimeout(function(){showEvolve(newStage);},250);
});
},1500);
if(CONFIG.adsEnabled&&L>=5&&S.stats.wins_since_ad>=CONFIG.interstitialEvery){
S.stats.wins_since_ad=0;S.stats.ads++;
try{window.BlokpopAds.showInterstitial();}catch(e){}
}
};
function showEvolve(stage){
var gift=60*stage;
S.stage=stage;syncSkin();S.coins+=gift;track('evolve',{stage:stage});save();
$('evoBanner').textContent=t('evolveTitle');
$('evoEle').innerHTML=eleSvg(stage,{mood:'happy'});
$('evoName').textContent=pname(stage);
$('evoSub').textContent=t('evoSub',{n:EL.STAGES[stage-1].bonus,c:gift});
openModal('mEvolve');SFX.evolve();vib([40,60,40,60,40,60,120]);
var c=centerOf($('evoEle'));confetti(c.x,c.y,70,560);
setTimeout(function(){confetti(c.x,c.y,50,600);},600);
$('mEvolve')._gift=gift;
}
BP.hooks.onLose=function(r){
var ls=lvStat(r.L);ls.f++;S.stats.loses++;
track('level_lose',{L:r.L});save();
$('btnRevive').textContent=t('revive',{n:CONFIG.reviveCost});
$('loseEle').innerHTML=eleSvg(stageNow(),{mood:'sad'});
setTimeout(function(){if(BP.G&&BP.G.state==='lose')openModal('mLose');},700);
};
function doRevive(){
if(S.coins<CONFIG.reviveCost){
toast(t('needCoins'));SFX.error();
if(CONFIG.adsEnabled)tryAdRevive();else{closeModal('mLose');renderQuick();openModal('mShop');}
return;
}
if(!BP.reviveSlot()){toast(t('maxSlot'));return;}
S.coins-=CONFIG.reviveCost;S.stats.revives++;track('revive',{L:curLevel,how:'coins'});
save();refreshCoins();closeModal('mLose');SFX.slot();
}
function tryAdRevive(){
window.BlokpopAds.showRewarded(function(ok){
if(!ok){toast(t('noAd'));return;}
S.stats.ads++;
if(BP.reviveSlot()){S.stats.revives++;track('revive',{L:curLevel,how:'ad'});save();closeModal('mLose');}
});
}
function useBooster(k){
if(cur!=='game'||paused)return;
if(S.boosters[k]<=0){renderQuick();openModal('mShop');return;}
var r=BP.booster(k);
if(r==='ok'){
S.boosters[k]--;S.stats.boosterUsed++;track('booster',{k:k,L:curLevel});
save();refreshBoosters();vib(20);
}else if(r==='noeffect'){toast(t(k==='slot'?'maxSlot':'noEffect'));SFX.error();}
}
function fillDebug(){
var rows=[];
for(var L=1;L<=BP.TOTAL_LEVELS;L++){
var s=S.lv[L];if(!s)continue;
rows.push('L'+L+' p'+s.p+' w'+s.w+' f'+s.f+' best'+s.best+' avgT'+(s.w?Math.round(s.tm/s.w):'-')+'s');
}
$('dbg').textContent='v'+CONFIG.version+'  coins '+S.coins+'  unlocked '+S.unlocked+'  stars '+totalStars()+'  stage '+stageNow()+'\n'+
JSON.stringify(S.stats)+'\nboosters '+JSON.stringify(S.boosters)+'\n\n'+rows.join('\n')+
'\n\nlast events:\n'+S.events.slice(-15).map(function(e){return JSON.stringify(e);}).join('\n');
}
var verTaps=0,verT=0;
function goTab(id){closeAll();show(id);}
function onAct(el){
var a=el.getAttribute('data-act');
ensureAudio();
if(a!=='node'&&a!=='bst'&&a!=='ver')SFX.click();
switch(a){
case'enter':S.stats.sessions++;save();goTab('map');break;
case'tab':goTab(el.getAttribute('data-t'));break;
case'playCur':startLevel(Math.min(S.unlocked,BP.TOTAL_LEVELS));break;
case'node':{
var L=parseInt(el.getAttribute('data-l'),10);
if(L>S.unlocked){toast(t('locked'));SFX.error();break;}
startLevel(L);break;
}
case'chest':openChest(parseInt(el.getAttribute('data-l'),10));break;
case'chestOpen':chestBtn();break;
case'evoOk':{
var gift=$('mEvolve')._gift||0,c=centerOf($('evoEle'));
closeModal('mEvolve');refreshHeader();
flyCoins(c.x,c.y,cur==='game'?'pill3':'pill1',10,gift,function(){refreshCoins();});
break;
}
case'toMap':closeAll();if(BP.G&&BP.G.state==='play'&&cur==='game')track('quit',{L:curLevel});goTab('map');break;
case'next':startLevel(Math.min(BP.TOTAL_LEVELS,curLevel+1));break;
case'replay':startLevel(curLevel);break;
case'revive':doRevive();break;
case'bst':if(el.classList){el.classList.remove('fx');void el.offsetWidth;el.classList.add('fx');}useBooster(el.getAttribute('data-t'));break;
case'settings':refreshSettings();openModal('mSettings');break;
case'info':closeModal('mSettings');openModal('mInfo');break;
case'close':closeAll();break;
case'tgSound':S.set.sound=!S.set.sound;save();refreshSettings();if(S.set.sound)SFX.slot();break;
case'tgVib':S.set.vib=!S.set.vib;save();refreshSettings();vib(30);break;
case'lang':S.set.lang=el.getAttribute('data-l');save();applyI18n();refreshSettings();
if(cur==='map')renderMap();if(cur==='shop')renderShop();if(cur==='char')renderChar();
if(cur==='game')$('gameLv').textContent=t('level',{n:curLevel});break;
case'buy':buy(el.getAttribute('data-k'));break;
case'pack':toast(t('soonMsg'));break;
case'daily':claimDaily(el);break;
case'wtab':wTab=el.getAttribute('data-s');renderChar();break;
case'wear':wear(el.getAttribute('data-s'),el.getAttribute('data-id'));break;
case'buyItem':buyItem(el.getAttribute('data-s'),el.getAttribute('data-id'));break;
case'ver':verTaps++;clearTimeout(verT);verT=setTimeout(function(){verTaps=0;},1500);
if(verTaps>=5){verTaps=0;closeModal('mSettings');fillDebug();openModal('mDebug');}break;
case'dbgReset':try{localStorage.removeItem(CONFIG.saveKey);}catch(e){}memStore=null;S=defaults();save();closeAll();applyI18n();goTab('map');break;
case'dbgUnlock':S.unlocked=BP.TOTAL_LEVELS;S.coins+=500;save();closeAll();goTab('map');break;
case'dbgStars':S.stars[1]=3;for(var q=2;q<=20;q++)S.stars[q]=3;S.unlocked=Math.max(S.unlocked,21);save();closeAll();goTab('char');break;
}
}
function findAct(n){while(n&&n!==document){if(n.getAttribute&&n.getAttribute('data-act'))return n;n=n.parentNode;}return null;}
function boot(){
window.__booted=true;
try{boot2();}catch(e){if(window.__bpErr)window.__bpErr('boot: '+(e&&e.message)+' | '+(e&&e.stack?String(e.stack).split('\n').slice(0,3).join(' / '):''));throw e;}
}
function boot2(){
load();
S.stage=Math.max(S.stage,1);
cv=$('cv');ctx=cv.getContext('2d');
applyI18n();refreshCoins();refreshBoosters();refreshSettings();
$('splashEle').innerHTML=eleSvg(Math.max(S.stage,1),{mood:'happy'});
document.addEventListener('click',function(e){
var el=findAct(e.target);if(!el)return;
onAct(el);
});
var onDown=function(e){
if(cur!=='game'||paused)return;
ensureAudio();
var r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;
var x=(p.clientX-r.left)*(BP.CW/r.width),y=(p.clientY-r.top)*(BP.CH/r.height);
var res=BP.tap(x,y);
if(res){
launches++;
if(launches>=2&&!S.tutorialDone){S.tutorialDone=true;$('hint').className='hint hidden';save();}
}
if(e.cancelable)e.preventDefault();
};
if(window.PointerEvent)cv.addEventListener('pointerdown',onDown);
else{cv.addEventListener('touchstart',onDown);cv.addEventListener('mousedown',onDown);}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
document.addEventListener('visibilitychange',syncPause);
document.addEventListener('contextmenu',function(e){e.preventDefault();});
var bar=$('splashBar'),p=0,tm=setInterval(function(){
p+=0.12+Math.random()*0.12;if(p>=1){p=1;clearInterval(tm);$('splashLoad').className='hidden';$('btnPlay').className='btn b-teal big';}
bar.style.width=Math.round(p*100)+'%';
},90);
var last=0;
function frame(ts){
var dt=last?(ts-last)/1000:0.016;last=ts;
if(cur==='game'&&!paused){
BP.update(dt);
var g=BP.G;
if(g)$('prog').style.width=Math.round((1-g.remPx/g.total)*100)+'%';
}
if(cur==='game')BP.render(ctx);
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
window.BlokpopUI={S:function(){return S;},CONFIG:CONFIG,startLevel:startLevel,boot:boot};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
