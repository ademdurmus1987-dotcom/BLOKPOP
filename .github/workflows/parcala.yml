name: Yapi bloklarini parcala (Blender)

# Adem'in Tripo blok modellerini Blender ile parcalara boler.
# Sonuclar: beta/yapi/model/parcali/*.glb + parcalar.json, onizlemeler: tools/blender/onizleme/*.png
# Oyun dosyalarina dokunmaz.
on:
  workflow_dispatch:
    inputs:
      parca:
        description: 'Her blok kac parcaya bolunsun'
        default: '12'
      modeller:
        description: 'Modeller (virgulle). Bos = hepsi'
        default: ''
  push:
    branches: [main]
    paths:
      - 'tools/blender/parcala.py'
      - 'tools/blender/kucult.py'
      - 'beta/yapi/model/kaynak/**'
      - '.github/workflows/parcala.yml'

permissions:
  contents: write

concurrency:
  group: parcala
  cancel-in-progress: false

jobs:
  parcala:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLENDER_V: '4.2.3'
      HEPSI: 'kup,kup_ahsap,kup_kirmizi,kup_metal,kup_tas,kup_altin,kup_ahsap_metal,sandik,varil,buz_silindir,piramit_tas,bal_kabagi,buz_kup_2,ahsap_kup_2,buz_dikey_kup,alev_tas_uzun_kup,mor_dikey_kup'
    steps:
      - uses: actions/checkout@v4

      - name: Blender onbellegi
        id: bcache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_V }}

      - name: Blender'i indir
        if: steps.bcache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/b.tar.xz "https://download.blender.org/release/Blender4.2/blender-${BLENDER_V}-linux-x64.tar.xz"
          tar xf /tmp/b.tar.xz -C /tmp
          mv "/tmp/blender-${BLENDER_V}-linux-x64" ~/blender

      - name: Gerekli sistem kutuphaneleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null

      - name: Yeni modelleri kucult (kaynak -> model)
        run: |
          ~/blender/blender -b --factory-startup -P tools/blender/kucult.py -- \
            beta/yapi/model/kaynak beta/yapi/model 6000 2>&1 | grep -E "KUCULT|BITTI|Error|rror:" | tee /tmp/k.txt
          grep -q "^BITTI" /tmp/k.txt

      - name: Parcala
        run: |
          M="${{ github.event.inputs.modeller }}"; [ -z "$M" ] && M="$HEPSI"
          P="${{ github.event.inputs.parca }}"; [ -z "$P" ] && P=12
          ~/blender/blender -b --factory-startup -P tools/blender/parcala.py -- \
            beta/yapi/model beta/yapi/model/parcali tools/blender/onizleme "$M" "$P" 2>&1 | grep -v "^Fra:" | tee /tmp/log.txt
          grep -q "^BITTI" /tmp/log.txt

      - name: Sonuclari repoya yukle
        run: |
          git config user.name "blokpop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add beta/yapi/model tools/blender/onizleme
          git diff --cached --quiet && { echo "Degisiklik yok"; exit 0; }
          git commit -m "Yapi: Blender ile parcalanmis blok modelleri ve onizlemeler"
          git pull --rebase origin main
          git push origin HEAD:main
